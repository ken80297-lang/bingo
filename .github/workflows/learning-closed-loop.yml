name: Learning closed-loop regression

on:
  pull_request:
    paths:
      - "bingo-ai-pro/backend/services/learning_engine.py"
      - "bingo-ai-pro/backend/services/recommendation_center.py"
      - "bingo-ai-pro/backend/services/prediction_service.py"
      - "bingo-ai-pro/backend/tests/test_learning_closed_loop_regression.py"
      - ".github/workflows/learning-closed-loop.yml"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bingo-ai-pro/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Compile changed services
        run: python -m py_compile services/learning_engine.py services/recommendation_center.py services/prediction_service.py
      - name: Run learning regression tests
        run: pytest -q tests/test_learning_closed_loop_regression.py
