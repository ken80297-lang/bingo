name: Repeat shadow research tests

on:
  pull_request:
    paths:
      - 'bingo-ai-pro/backend/services/repeat_number_shadow.py'
      - 'bingo-ai-pro/backend/tests/test_repeat_number_shadow.py'
      - 'bingo-ai-pro/backend/tests/test_repeat_shadow_runner.py'
      - 'bingo-ai-pro/backend/research_repeat_shadow.py'
      - '.github/workflows/repeat-shadow-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated research tests
        working-directory: bingo-ai-pro/backend
        run: python -m unittest discover -s tests -p 'test_repeat*shadow*.py' -v
