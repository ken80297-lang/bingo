<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bingo AI 智慧預測中心</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111c;
      --panel: #101c28;
      --panel-soft: #162638;
      --text: #f4f8ff;
      --muted: #9fb1c8;
      --line: #284058;
      --ok: #2fd17c;
      --warn: #f6c344;
      --bad: #ff6478;
      --accent: #59c7ff;
      --super: #ffd166;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 16% 0%, rgba(89, 199, 255, .18), transparent 32%),
        radial-gradient(circle at 85% 4%, rgba(47, 209, 124, .10), transparent 30%),
        linear-gradient(180deg, #07111c 0%, #0b1724 100%);
      color: var(--text);
      font-family: Arial, "Microsoft JhengHei", "PingFang TC", sans-serif;
      line-height: 1.55;
    }

    main {
      width: min(780px, 100%);
      margin: 0 auto;
      padding: 18px 12px 42px;
    }

    header {
      padding: 10px 4px 18px;
    }

    h1 {
      margin: 0;
      font-size: 29px;
      line-height: 1.22;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 20px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    h3 {
      margin: 16px 0 8px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #1c344a;
      color: var(--text);
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 800;
    }

    .card {
      width: 100%;
      margin-bottom: 14px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(16, 28, 40, .96);
      box-shadow: 0 16px 36px rgba(0, 0, 0, .24);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      min-width: 0;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 10px;
      background: var(--panel-soft);
    }

    .metric .label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .metric .value {
      font-size: 20px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .balls, .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .ball {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 46px;
      height: 38px;
      padding: 0 12px;
      border-radius: 999px;
      background: #243d55;
      border: 1px solid rgba(255,255,255,.08);
      color: var(--text);
      font-size: 18px;
      font-weight: 900;
    }

    .ball.super {
      border-color: rgba(255, 100, 120, .95);
      background: rgba(255, 100, 120, .18);
      color: #ffb3bf;
      box-shadow: 0 0 0 3px rgba(255, 100, 120, .16);
    }

    .ball.hit {
      background: #f6c344;
      color: #111827;
      border-color: rgba(255, 255, 255, .28);
      box-shadow: 0 0 0 3px rgba(246, 195, 68, .18);
    }

    .card-two-shell {
      display: grid;
      gap: 14px;
    }

    .card-two-title {
      display: grid;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .card-two-summary {
      display: grid;
      gap: 10px;
    }

    .card-two-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .card-two-pill {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 6px 10px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      background: rgba(22, 38, 56, .82);
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .card-two-pill-finalized {
      border-color: rgba(47, 209, 124, .34);
      background: rgba(47, 209, 124, .14);
      color: var(--ok);
    }

    .card-two-numbers {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
    }

    .card-two-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      height: 36px;
      padding: 0 10px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 999px;
      background: #243d55;
      color: var(--text);
      font-size: 17px;
      font-weight: 900;
    }

    .card-two-number-hit {
      border-color: rgba(255, 255, 255, .28);
      background: #f6c344;
      color: #111827;
      box-shadow: 0 0 0 3px rgba(246, 195, 68, .18);
    }

    .card-two-number-super {
      border-color: rgba(255, 100, 120, .95);
      color: #ffb3bf;
      box-shadow: 0 0 0 3px rgba(255, 100, 120, .16);
    }

    .card-two-number-hit.card-two-number-super {
      color: #7f1d1d;
    }

    .card-two-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 2px;
      border-color: rgba(89, 199, 255, .28);
      background: #1c344a;
      text-align: left;
      cursor: pointer;
    }

    .analysis-report-list {
      display: grid;
      gap: 10px;
    }

    .analysis-report-rule {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px;
      background: var(--panel-soft);
    }

    .analysis-report-rule-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-weight: 900;
    }

    .analysis-report-field {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .analysis-report-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .analysis-report-text {
      overflow-wrap: anywhere;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #1d3144;
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
    }

    .list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 10px;
      background: var(--panel-soft);
    }

    .row span:last-child {
      text-align: right;
      font-weight: 800;
    }

    .empty, .notice {
      padding: 13px;
      border-radius: 10px;
      background: #162433;
      color: var(--muted);
    }

    .notice.warn { color: var(--warn); }
    .notice.bad { color: var(--bad); }
    .notice.ok { color: var(--ok); }

    .status-ok { color: var(--ok); }
    .status-warning { color: var(--warn); }
    .status-error { color: var(--bad); }
    .status-unknown { color: var(--muted); }

    .bar {
      height: 10px;
      border-radius: 999px;
      background: #263849;
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--ok), var(--warn), var(--bad));
    }

    .collapse-button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      text-align: left;
      cursor: pointer;
    }

    .summary-line {
      color: var(--muted);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .next-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 10px;
    }

    .next-card-header h2 {
      margin-bottom: 3px;
    }

    .next-issue {
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }

    .confidence-badge {
      flex: 0 0 auto;
      padding: 8px 12px;
      border: 1px solid rgba(47, 209, 124, .34);
      border-radius: 999px;
      background: rgba(47, 209, 124, .14);
      color: var(--ok);
      font-size: 15px;
      font-weight: 900;
      white-space: nowrap;
    }

    .quick-status {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .status-pill {
      padding: 5px 9px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      background: rgba(22, 38, 56, .74);
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .compact-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .card1-title {
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .card1-title h2 {
      margin-bottom: 4px;
    }

    #cardNext {
      height: 1080px;
      overflow-y: auto;
    }

    #cardNext .number-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .card1-section {
      padding: 14px 0;
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .card1-section:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .card1-section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .card1-section-title h3 {
      margin: 0;
      color: var(--text);
      font-size: 16px;
    }

    .card1-info-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 11px 12px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 10px;
      background: var(--panel-soft);
      font-weight: 900;
    }

    .card1-info-line .summary-line {
      margin-top: 3px;
      font-weight: 500;
    }

    .card1-fixed-row {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 7px 0;
      font-weight: 900;
    }

    .card1-fixed-row span:first-child {
      color: var(--muted);
    }

    .card1-signal-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .card1-signal {
      min-height: 78px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 10px;
      background: var(--panel-soft);
    }

    .card1-signal span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .card1-signal strong {
      display: block;
      margin-top: 4px;
      font-size: 22px;
      line-height: 1.2;
    }

    .number-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .number-grid .ball {
      width: 100%;
      min-width: 0;
    }

    .rule-snapshot-list {
      display: grid;
      gap: 8px;
    }

    .rule-snapshot-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
      padding: 9px 10px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 8px;
      background: var(--panel-soft);
      font-size: 13px;
    }

    .compact-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .compact-heading h3 {
      margin: 0;
      color: var(--text);
    }

    .compact-note {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .ball.featured {
      min-width: 54px;
      height: 44px;
      border-color: rgba(89, 199, 255, .32);
      background: #2a4a65;
      color: #f7fbff;
      font-size: 20px;
      box-shadow: 0 0 0 3px rgba(89, 199, 255, .08);
    }

    .trend-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .trend-summary.single {
      grid-template-columns: 1fr;
    }

    .trend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 10px;
      background: var(--panel-soft);
    }

    .trend-item span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .trend-item strong {
      text-align: right;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .section {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .mini-title {
      margin: 0 0 8px;
      color: var(--text);
      font-size: 15px;
      font-weight: 900;
    }

    .rule-list {
      display: grid;
      gap: 10px;
    }

    .rule-item {
      padding: 12px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 10px;
      background: var(--panel-soft);
    }

    .rule-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .muted {
      color: var(--muted);
    }

    details {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      background: rgba(16, 28, 40, .72);
    }

    summary {
      cursor: pointer;
      color: var(--muted);
      font-weight: 800;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: var(--muted);
      font-size: 12px;
    }

    @media (min-width: 720px) {
      main { padding-top: 28px; }
      h1 { font-size: 34px; }
      .card { padding: 22px; }
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 520px) {
      main { padding-left: 10px; padding-right: 10px; padding-bottom: 72px; }
      h1 { font-size: 26px; }
      .card { padding: 14px; border-radius: 10px; }
      .grid { grid-template-columns: 1fr; }
      .ball {
        min-width: 40px;
        height: 36px;
        padding: 0 10px;
        font-size: 16px;
      }
      .metric .value { font-size: 18px; }
      .row { align-items: flex-start; }
      .row span:last-child { max-width: 58%; }
      .next-card-header { flex-direction: column; align-items: stretch; }
      .confidence-badge { align-self: flex-start; }
      .ball.featured {
        min-width: 46px;
        height: 40px;
        font-size: 18px;
      }
      .number-grid { gap: 6px; }
      .card-two-number {
        min-width: 38px;
        height: 34px;
        padding: 0 9px;
        font-size: 16px;
      }
      .card-two-meta { align-items: flex-start; }
      .card1-section-title { align-items: flex-start; flex-direction: column; }
      .card1-info-line { justify-content: flex-start; }
      .rule-snapshot-row { grid-template-columns: 1fr; }
      .trend-summary { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Bingo AI 智慧預測中心</h1>
      <div class="subtitle">打開首頁 5 秒內看懂下一期推薦、老玩家模式、資料同步與 AI 成績。</div>
      <div class="toolbar">
        <button type="button" id="refreshButton">重新整理</button>
        <span id="refreshState">載入中</span>
      </div>
    </header>

    <div id="errorBox" class="notice warn" style="display:none"></div>

    <section>
      <article class="card" id="cardNext"></article>
      <article class="card" id="cardTwo"></article>
      <article class="card" id="cardReasons"></article>
      <article class="card" id="cardAlerts"></article>
      <article class="card" id="cardHistory"></article>
      <article class="card" id="cardSync"></article>
      <article class="card" id="cardWake"></article>
      <article class="card" id="cardContinuity"></article>
      <article class="card" id="cardPipeline"></article>
      <article class="card" id="cardOfficial"></article>
      <article class="card" id="cardOperations"></article>
      <article class="card" id="cardEvolution"></article>
    </section>

    <details>
      <summary>進階資訊 / Developer</summary>
      <pre id="developerInfo">載入中</pre>
    </details>
  </main>

  <script>
    const API_TIMEOUT_MS = 10000;
    const HEALTH_STORAGE_KEY = "bingo-ai-health-cache";
    const CARD_TWO_STORAGE_KEY = "bingo-ai-card-two-cache";
    const HEALTH_STORAGE_MAX_AGE_MS = 30 * 60 * 1000;
    let cardOneFallbackHtml = "";
    const DASHBOARD_TAB_ID = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    const DASHBOARD_LEADER_KEY = "bingo-ai-dashboard-leader";
    const DASHBOARD_LEADER_TTL_MS = 30 * 1000;
    const DASHBOARD_LEADER_HEARTBEAT_MS = 10 * 1000;
    const DASHBOARD_PLAYER_SUMMARY_INTERVAL_MS = 120 * 1000;
    const DASHBOARD_SYSTEM_INTERVAL_MS = 120 * 1000;
    const DASHBOARD_LATEST_SYNC_INTERVAL_MS = 120 * 1000;
    const DASHBOARD_WAKE_STATUS_INTERVAL_MS = 300 * 1000;
    const DASHBOARD_SLOW_INTERVAL_MS = 5 * 60 * 1000;
    const DASHBOARD_SLOW_INITIAL_DELAY_MS = 10 * 1000;
    const DASHBOARD_SLOW_STAGGER_MS = 1000;

    const apis = {
      playerSummary: "/api/dashboard/player-summary",
      next: "/api/next-prediction",
      system: "/api/system/status",
      official: "/api/official/statistics",
      health: "/api/pipeline/health",
      operations: "/api/operations/summary",
      evolution: "/api/strategy-evolution/latest",
      evolutionHistory: "/api/strategy-evolution/history",
      collectorStatus: "/api/collector/status",
      collectorGaps: "/api/collector/gaps",
      latestSync: "/api/collector/latest-sync",
      wakeStatus: "/api/health/wake-status",
      analysisLatest: "/api/analysis/latest"
    };

    const fastApiKeys = ["playerSummary", "system", "latestSync", "wakeStatus"];
    const slowApiKeys = Object.keys(apis).filter((key) => !fastApiKeys.includes(key));
    const pollState = {
      latest: {},
      timers: [],
      inFlight: {},
      isLeader: false,
      slowTimersScheduled: false,
      slowCursor: 0,
      slowTimeouts: [],
      leaderHeartbeatTimer: null,
      broadcast: null
    };

    const zhStatus = {
      ok: "正常",
      warning: "警告",
      error: "錯誤",
      unknown: "未知",
      running: "執行中",
      available: "可用",
      ready: "已準備",
      waiting_draw: "等待開獎",
      verified: "已驗證",
      learned: "已學習",
      expired: "已過期",
      failed: "失敗",
      skipped_due_to_lock: "前一輪仍在執行",
      complete: "完整",
      incomplete: "不完整"
    };

    Object.assign(zhStatus, {
      ready: "等待開獎",
      waiting_draw: "等待開獎",
      waiting_refresh: "等待同步",
      verified: "已驗證",
      learned: "已學習",
      expired: "已過期",
      unavailable: "尚無資料"
    });

    const officialStatusText = (status) => {
      if (status === "verified" || status === "official_verified") return "🟢 官方已驗證";
      if (status === "pending" || status === "pending_verification") return "待驗證";
      return "待驗證";
    };

    const normalizeOfficialStatus = (status) => {
      if (status === "official_verified") return "verified";
      if (["verified", "pending", "pending_verification", "unknown"].includes(status)) return status;
      return "unknown";
    };

    const safe = (value, fallback = "尚無資料") => {
      if (value === null || value === undefined || value === "" || Number.isNaN(value)) return fallback;
      return String(value);
    };

    const escapeHtml = (value) => safe(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

    const cardTwoText = (value, fallback = "尚無資料") => escapeHtml(safe(value, fallback));

    const asList = (value) => Array.isArray(value) ? value : [];

    const fmtNumber = (value, fallback = "0") => {
      const n = Number(value);
      if (!Number.isFinite(n)) return fallback;
      return n.toFixed(2).replace(/\.?0+$/, "");
    };

    const percent = (value) => {
      const n = Number(value);
      if (!Number.isFinite(n)) return "0%";
      return `${fmtNumber(n > 1 ? n : n * 100)}%`;
    };

    const confidencePercentValue = (value, fallback = 0) => {
      const n = Number(value);

    async function loadJson(key, url, timeoutMs = API_TIMEOUT_MS) {
      if (pollState.inFlight[key]) {
        return { __skipped: true, status: "skipped", reason: "request_in_flight" };
      }
      pollState.inFlight[key] = true;
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { cache: "no-store", signal: controller.signal });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        if (key === "health") saveHealthBrowserCache(payload);
        return payload;
      } catch (error) {
        const message = error && error.name === "AbortError"
          ? `${url} timeout after ${timeoutMs / 1000}s`
          : `${url} ${error && error.message ? error.message : error}`;
        console.warn("[dashboard] API failed", { endpoint: url, error: message });
        if (key === "health") {
          const cachedHealth = loadHealthBrowserCache();
          if (cachedHealth) return cachedHealth;
        }
        return { status: "unknown", unavailable: true, error: message };
      } finally {
        clearTimeout(timer);
        pollState.inFlight[key] = false;
      }
    }

    async function loadApiGroup(keys, renderAfter = true) {
      if (document.visibilityState !== "visible" || !pollState.isLeader) return;
      document.getElementById("refreshState").textContent = "Loading";
      const loaded = await Promise.allSettled(
        keys.map(async (key) => [key, await loadJson(key, apis[key])])
      );
      const errors = [];
      for (const entry of loaded) {
        if (entry.status === "fulfilled") {
          const [key, payload] = entry.value;
          if (payload && payload.__skipped) continue;
          pollState.latest[key] = payload;
        } else {
          errors.push(entry.reason && entry.reason.message ? entry.reason.message : String(entry.reason));
        }
      }
      if (renderAfter) render(pollState.latest, errors);
      publishDashboardSnapshot();
      document.getElementById("refreshState").textContent = `Updated ${new Date().toLocaleString()}`;
    }

      try {

          tabId: DASHBOARD_TAB_ID,
          expiresAt: Date.now() + DASHBOARD_LEADER_TTL_MS,
          updatedAt: Date.now()

    function ensurePollingLeader() {
      if (document.visibilityState !== "visible") {
        pollState.isLeader = false;
        return false;
      }
      const lease = safeReadLeaderLease();
      const now = Date.now();
      if (!lease || lease.tabId === DASHBOARD_TAB_ID || Number(lease.expiresAt || 0) <= now) {
        pollState.isLeader = safeWriteLeaderLease();
      } else {
        pollState.isLeader = false;
      }
      return pollState.isLeader;
    }

    function startLeaderHeartbeat() {
      if (pollState.leaderHeartbeatTimer) clearInterval(pollState.leaderHeartbeatTimer);

    }

    function publishDashboardSnapshot() {
      const message = { type: "dashboard-snapshot", latest: pollState.latest, at: Date.now(), tabId: DASHBOARD_TAB_ID };
      if (pollState.broadcast) {
        try {
          pollState.broadcast.postMessage(message);
        } catch (error) {
          console.warn("[dashboard] broadcast failed", error);
        }
      }
      try {
        localStorage.setItem("bingo-ai-dashboard-snapshot", JSON.stringify(message));
      } catch (error) {
        console.warn("[dashboard] snapshot save failed", error);
      }
    }

    function receiveDashboardSnapshot(message) {
      if (!message || message.type !== "dashboard-snapshot" || message.tabId === DASHBOARD_TAB_ID) return;
      if (!message.latest || typeof message.latest !== "object") return;
      pollState.latest = message.latest;
      render(pollState.latest, []);
      document.getElementById("refreshState").textContent = `Updated ${new Date().toLocaleString()}`;
    }

    function scheduleTimer(callback, delayMs) {
      const timer = setInterval(callback, delayMs);
      pollState.timers.push(timer);
      return timer;
    }

    function clearSlowApiTimeouts() {
      pollState.slowTimeouts.forEach((timer) => clearTimeout(timer));
      pollState.slowTimeouts = [];
    }

    function scheduleSlowApiStagger({ immediate = false } = {}) {
      if (document.visibilityState !== "visible" || !pollState.isLeader) return;
      clearSlowApiTimeouts();
      slowApiKeys.forEach((key, index) => {
        const delay = immediate ? index * DASHBOARD_SLOW_STAGGER_MS : DASHBOARD_SLOW_INITIAL_DELAY_MS + (index * DASHBOARD_SLOW_STAGGER_MS);
        const timer = setTimeout(() => {
          if (document.visibilityState === "visible" && pollState.isLeader) loadApiGroup([key]);
        }, delay);
        pollState.slowTimeouts.push(timer);
      });
      if (pollState.slowTimersScheduled) return;
      scheduleTimer(() => {
        const key = slowApiKeys[pollState.slowCursor % slowApiKeys.length];
        pollState.slowCursor += 1;
        loadApiGroup([key]);
      }, DASHBOARD_SLOW_INTERVAL_MS);
      pollState.slowTimersScheduled = true;
    }

    function stopPolling() {
      pollState.timers.forEach((timer) => clearInterval(timer));
      pollState.timers = [];
      clearSlowApiTimeouts();
      pollState.slowTimersScheduled = false;
      if (pollState.leaderHeartbeatTimer) clearInterval(pollState.leaderHeartbeatTimer);
      pollState.leaderHeartbeatTimer = null;
    }

    function startVisiblePolling({ initial = false } = {}) {
      stopPolling();
      if (!ensurePollingLeader()) return;
      startLeaderHeartbeat();
      loadApiGroup(initial ? fastApiKeys : ["playerSummary", "system"]);
      scheduleTimer(() => loadApiGroup(["playerSummary"]), DASHBOARD_PLAYER_SUMMARY_INTERVAL_MS);
      scheduleTimer(() => loadApiGroup(["system"]), DASHBOARD_SYSTEM_INTERVAL_MS);
      scheduleTimer(() => loadApiGroup(["latestSync"]), DASHBOARD_LATEST_SYNC_INTERVAL_MS);
      scheduleTimer(() => loadApiGroup(["wakeStatus"], false), DASHBOARD_WAKE_STATUS_INTERVAL_MS);
      scheduleSlowApiStagger({ immediate: false });
    }

    function startHiddenPolling() {
      stopPolling();
      pollState.isLeader = false;
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        startVisiblePolling({ initial: false });
      } else {
        startHiddenPolling();
      }
    });

    if (typeof BroadcastChannel !== "undefined") {
      pollState.broadcast = new BroadcastChannel("bingo-ai-dashboard-traffic");
      pollState.broadcast.onmessage = (event) => receiveDashboardSnapshot(event.data);
    }

    if (typeof window !== "undefined" && typeof window.addEventListener === "function") {
      window.addEventListener("storage", (event) => {
        if (event.key === "bingo-ai-dashboard-snapshot" && event.newValue) {
          try {
            receiveDashboardSnapshot(JSON.parse(event.newValue));
          } catch (error) {
            console.warn("[dashboard] snapshot parse failed", error);
          }
        }
        if (event.key === DASHBOARD_LEADER_KEY && document.visibilityState === "visible" && !pollState.isLeader) {
          const lease = safeReadLeaderLease();
          if (!lease || Number(lease.expiresAt || 0) <= Date.now()) startVisiblePolling({ initial: false });
        }
      });
    }

      const previous = verification || payload.previous_verification || {};
      const predicted = normalizeNumbers(previous.predicted_numbers);
      const official = normalizeNumbers(previous.official_numbers || previous.draw_numbers);
      const matched = normalizeNumbers(previous.matched_numbers);
      const denominator = previous.hit_denominator || previous.prediction_count || predicted.length || 20;
      const verified = previous.verification_status === "verified";
      const learned = Boolean(previous.learning_used);
      const previousMode = previous.previous_result_mode || "unavailable";
      const previousTitle = previousMode === "latest_available_verified" ? "最近可驗證推薦結果" : "上一期推薦結果";
      const previousNote = previousMode === "latest_available_verified"
        ? `<div class="notice warn">第${safe(previous.requested_target_issue)}期尚無可顯示 prediction，改顯示最近可驗證的第${safe(previous.displayed_target_issue)}期。</div>`
        : "";
      const warnings = asList(system.warnings).filter(Boolean);
      const status = payload.status === "partial" || warnings.length ? "warning" : "ok";
      const syncOk = collector.is_synced === true || Number(collector.lag_count || 0) === 0;
      document.getElementById("cardReasons").innerHTML = `
        <h2>🤖 AI 運作中心</h2>
        <h3>最新處理資訊</h3>
        <div class="grid">
          ${metric("目前期號", safe(latestProcessing.current_issue || collector.database_latest_issue || "尚無資料"))}
          ${metric("Database 最新期", safe(latestProcessing.database_latest_issue || collector.database_latest_issue || "尚無資料"))}
          ${metric("Source 最新期", safe(latestProcessing.source_latest_issue || collector.latest_issue || "尚無資料"))}
          ${metric("最後成功同步", formatDateTime(latestProcessing.last_successful_collection || collector.last_successful_collection))}
        </div>
        <h3>AI 流程</h3>
        <div class="grid">
          ${metric("推薦狀態", statusText(aiFlow.next_prediction_status || payload.next_prediction_status || "unknown"), statusClass(aiFlow.next_prediction_status || payload.next_prediction_status || "unknown"))}
          ${metric("預測流程", statusText(aiFlow.prediction_status || payload.prediction_status || "unknown"), statusClass(aiFlow.prediction_status || payload.prediction_status || "unknown"))}
          ${metric("部分降級", (aiFlow.partial || payload.status === "partial") ? "是" : "否", (aiFlow.partial || payload.status === "partial") ? "status-warning" : "status-ok")}
        </div>
        <h3>今日運作摘要</h3>
        <div class="grid">
          ${metric("開獎資料", fmtNumber(todaySummary.draw_count ?? quality.draw_count))}
          ${metric("推薦資料", fmtNumber(todaySummary.prediction_count ?? quality.prediction_count))}
          ${metric("已驗證", fmtNumber(todaySummary.verified_prediction_count ?? quality.verified_prediction_count))}
          ${metric("統計樣本", `${fmtNumber(todaySummary.statistics_sample_count ?? quality.statistics_sample_count)} 期`)}
        </div>
        <h3>系統健康</h3>
        <div class="grid">
          ${metric("整體狀態", status === "ok" ? "正常" : "部分資料更新中", statusClass(status))}
          ${metric("健康狀態", statusText(systemHealth.status || status), statusClass(systemHealth.status || status))}
          ${metric("同步狀態", syncOk ? "已同步" : `落後 ${fmtNumber(collector.lag_count)} 期`, syncOk ? "status-ok" : "status-warning")}
          ${metric("警告數", fmtNumber(asList(systemHealth.warnings || warnings).length))}
        </div>
        ${warnings.length ? `<div class="notice warn">資料更新中：${warnings.map((item) => safe(item)).join("、")}</div>` : ""}
        <h3>AI 學習狀態</h3>
        <div class="grid">
          ${metric("學習狀態", statusText(learningStatus.status || learning.status || "unknown"), statusClass(learningStatus.status || learning.status || "unknown"))}
          ${metric("統計樣本", `${fmtNumber(learningStatus.sample_size ?? learning.sample_size)} 期`)}
          ${metric("平均命中", `${fmtNumber(learningStatus.average_hits ?? learning.average_hits)} / 20`)}
          ${metric("等待學習", fmtNumber(learningStatus.pending_learning ?? learning.pending_learning))}
        </div>
        <h3>版本資訊</h3>
        <div class="grid">
          ${metric("Model", safe(versionInfo.model_version || model.model_version || "尚無資料"))}
          ${metric("Feature", safe(versionInfo.feature_version || model.feature_version || "尚無資料"))}
          ${metric("Release", safe(versionInfo.release_version || model.release_version || "尚無資料"))}
          ${metric("Generation", safe(versionInfo.production_generation || model.production_generation || "尚無資料"))}
        </div>
        <h3>下一期資訊</h3>
        <div class="grid">
          ${metric("預測期號", nextIssue.target_issue ? `第${safe(nextIssue.target_issue)}期` : "尚無資料")}
          ${metric("依據期號", nextIssue.source_issue ? `第${safe(nextIssue.source_issue)}期` : "尚無資料")}
          ${metric("預估開獎時間", formatDateTime(nextIssue.expected_draw_time))}
          ${metric("推薦狀態", nextIssue.recommendation_ready ? "20 碼完整" : "等待推薦資料", nextIssue.recommendation_ready ? "status-ok" : "status-warning")}
        </div>
        <h3>${previousTitle}摘要</h3>
        ${previousNote}
        <div class="grid">
          ${metric("比對期號", `第${safe(previous.target_issue || previous.verified_issue)}期`)}
          ${metric("開獎時間", formatDateTime(previous.draw_time))}
          ${metric("命中", verified ? `${fmtNumber(previous.hit_count)} / ${fmtNumber(denominator)}` : "尚未完成", verified ? "status-ok" : "status-warning")}
          ${metric("Verified 狀態", verified ? "已完成驗證" : "尚未完成", verified ? "status-ok" : "status-warning")}
          ${metric("Learned 狀態", learned ? "已完成學習" : "尚未完成", learned ? "status-ok" : "status-warning")}
        </div>
        <h3>預測號碼</h3>${predicted.length ? balls(predicted, "", matched) : `<div class="empty">尚無資料</div>`}
        <h3>開獎號碼</h3>${official.length ? balls(official, "", matched) : `<div class="empty">尚無資料</div>`}
      `;
    }

    function alertRow(label, item) {
      const percentValue = Number(item && (item.percent || item.score || item.confidence) || 0);
      const width = Math.max(0, Math.min(100, percentValue));
      const stars = Math.max(0, Math.min(5, Number(item && item.stars) || Math.round(width / 20)));
      return `
        <div class="row" style="display:block">
          <div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:7px">
            <span>${label}</span><strong>${"★".repeat(stars)}${"☆".repeat(5 - stars)}</strong>
          </div>
          <div class="bar"><span style="width:${width}%"></span></div>
        </div>
      `;
    }

    function renderAlerts(alerts, analysis) {
      const body = analysis.analysis || analysis.data || analysis || {};
      const aiScore = body.ai_score || {};
      document.getElementById("cardAlerts").innerHTML = `
        <h2>4. 下一期預警</h2>
        ${rows([
          alertRow("大群聚", alerts.cluster_alert || aiScore.cluster_aftershock_recovery),
          alertRow("補號爆發", alerts.patch_alert),
          alertRow("雙生號", alerts.twin_alert),
          alertRow("連號", alerts.consecutive_alert),
          alertRow("超級獎號軌跡", alerts.super_alert || aiScore.super_number_trajectory_recovery)
        ])}
      `;
    }

    function renderHistory(history, verification, counts, historyRecords = []) {
      const records = asList(historyRecords).filter((item) => item && item.production_valid !== false && item.prediction_issue);
      if (!records.length) {
        document.getElementById("cardHistory").innerHTML = `<h2>歷史推薦紀錄</h2><div class="empty">${safe(history && history.message, "尚未累積正式推薦紀錄，系統會持續保存後續推薦。")}</div>`;
        return;
      }
      const sampleSize = Number(history.sample_size || counts.statistics_sample_count || 0);
      const sampleHint = sampleSize > 0 && sampleSize < 20 ? `<div class="notice warn">樣本數較少，結果僅供參考。</div>` : "";
      const verifiedCount = records.filter((item) => item.verification_status === "verified" || item.prediction_status === "verified").length;
      const learnedCount = records.filter((item) => item.learning_used).length;
      const waitingCount = records.filter((item) => item.prediction_status === "waiting_draw").length;
      const averageHits = records.length
        ? records.reduce((sum, item) => sum + Number(item.hit_count || 0), 0) / records.length
        : 0;
      const recordHtml = records.slice(0, 20).map((item, index) => {
        const predicted = normalizeNumbers(item.recommend_numbers);
        const official = normalizeNumbers(item.winning_numbers);
        const matched = normalizeNumbers(item.matched_numbers);
        const denominator = item.prediction_count || predicted.length || 20;
        const verified = item.verification_status === "verified" || item.prediction_status === "verified";
        const learned = Boolean(item.learning_used);
        return `
          <div class="rule-item">
            <button class="collapse-button" type="button" aria-expanded="${index === 0 ? "true" : "false"}" aria-controls="historyItem${index}" onclick="toggleSection('historyItem${index}', this)">
              <span>預測期號：第${safe(item.prediction_issue)}期</span><span>${index === 0 ? "收合" : "展開查看"}</span>
            </button>
            <div id="historyItem${index}" ${index === 0 ? "" : "hidden"}>
              <div class="grid section">
                ${metric("預測期號", `第${safe(item.prediction_issue)}期`)}
                ${metric("依據期號", `第${safe(item.based_on_issue || item.issue)}期`)}
                ${metric("依據開獎時間", formatDateTime(item.based_on_draw_time))}
                ${metric("推薦建立時間", formatDateTime(item.prediction_created_at || item.created_at))}
                ${metric("命中", verified ? `${fmtNumber(item.hit_count)} / ${fmtNumber(denominator)}` : "等待開獎", verified ? "status-ok" : "status-warning")}
                ${metric("Prediction 狀態", statusText(item.prediction_status), statusClass(item.prediction_status))}
              </div>
              <h3>推薦20碼</h3>${balls(predicted, "", matched)}
              ${predicted.length !== 20 ? `<div class="notice warn">此筆保存 ${fmtNumber(predicted.length)} 碼，分母使用實際保存數量。</div>` : ""}
              <h3>官方20碼</h3>${official.length ? balls(official, "", matched) : `<div class="empty">尚待開獎</div>`}
              <div class="grid section">
                ${metric("官方超級獎號", item.official_super_number ? numberLabel(item.official_super_number) : "尚無資料")}
                ${metric("超級獎命中", item.super_number_hit ? "命中" : "未命中", item.super_number_hit ? "status-ok" : "")}
                ${metric("Verified", verified ? "已完成驗證" : "尚未完成", verified ? "status-ok" : "status-warning")}
                ${metric("Learned", learned ? "已完成學習" : "尚未完成", learned ? "status-ok" : "status-warning")}
                ${metric("來源", sourceText(item.source))}
                ${metric("Trigger", triggerText(item.trigger))}
                ${metric("驗證時間", verified ? formatDateTime(item.verified_at) : "尚未完成")}
                ${metric("學習時間", learned ? formatDateTime(item.learned_at) : "尚未完成")}
              </div>
            </div>
          </div>
        `;
      }).join("");
      document.getElementById("cardHistory").innerHTML = `
        <h2>歷史推薦紀錄</h2>
        <div class="section">
          <p class="mini-title">正式推薦統計</p>
          <div class="grid">
            ${metric("正式推薦總數", fmtNumber(counts.valid_prediction_count || records.length))}
            ${metric("已驗證數", fmtNumber(counts.verified_prediction_count || verifiedCount))}
            ${metric("已學習數", fmtNumber(counts.learning_sample_count || learnedCount))}
            ${metric("等待開獎數", fmtNumber(waitingCount))}
            ${metric("平均命中", `${fmtNumber(history.average_hits || averageHits)} / 20`)}
            ${metric("統計樣本", `${fmtNumber(sampleSize)}期`)}
            ${metric("20碼命中分布", `五星率 ${fmtNumber(history.five_star_rate)}%`)}
            ${metric("Cache 狀態", history.cache ? `${safe(history.cache.status)} / ${fmtNumber(history.cache.ttl_seconds)}秒` : "即時資料")}
          </div>
          ${sampleHint}
        </div>
        <div class="section">
          <p class="mini-title">最近正式推薦</p>
          <div class="rule-list">${recordHtml}</div>
        </div>
      `;
    }

    function renderSync(system, currentDraw, counts, collectorStatus) {
      const lag = Number(system.issues_behind ?? system.lag_count ?? collectorStatus.lag_count ?? 0);
      const syncStatus = system.sync_status || (lag > 0 || system.is_synced === false ? "database_behind" : "synced");
      const status = syncStatus === "synced" ? "ok" : (["analysis_pending", "prediction_pending", "stale"].includes(syncStatus) ? "warning" : "error");
      const officialIssue = system.official_detected_issue || system.source_latest_issue || system.official_latest_issue || system.latest_issue || currentDraw.issue;
      const databaseIssue = system.database_latest_issue;
      const dashboardIssue = system.dashboard_latest_issue || currentDraw.issue;
      const consistent = officialIssue && databaseIssue && dashboardIssue && String(officialIssue) === String(databaseIssue) && String(databaseIssue) === String(dashboardIssue);
      const summary = consistent && status === "ok" ? "同步正常" : (lag ? `落後 ${fmtNumber(lag)} 期` : statusText(syncStatus));
      document.getElementById("cardSync").innerHTML = `
        <h2>資料同步</h2>
        <div class="grid">
          ${metric("官方偵測最新期號", safe(officialIssue))}
          ${metric("資料庫最新期號", safe(databaseIssue))}
          ${metric("Dashboard 顯示期號", safe(dashboardIssue))}
          ${metric("是否一致", consistent ? "一致" : "不一致", consistent ? "status-ok" : "status-warning")}
          ${metric("同步狀態", summary, statusClass(status))}
          ${metric("最後成功抓取時間", safe(system.latest_saved_at || system.last_successful_collect_time || collectorStatus.last_collector_finished_at))}
          ${metric("資料庫是否已保存", system.database_saved ? "已保存" : "未保存", system.database_saved ? "status-ok" : "status-error")}
          ${metric("分析是否完成", system.analysis_created ? "已完成" : "待處理", system.analysis_created ? "status-ok" : "status-warning")}
          ${metric("推薦是否完成", system.prediction_created ? "已完成" : "待處理", system.prediction_created ? "status-ok" : "status-warning")}
          ${metric("Stale 狀態", syncStatus === "stale" ? "stale" : "normal", statusClass(syncStatus === "stale" ? "warning" : "ok"))}
        </div>
        <h3>最新開獎資料</h3>
        <div class="grid">
          ${metric("期號", safe(currentDraw.issue))}
          ${metric("開獎時間", safe(currentDraw.draw_time))}
          ${metric("資料來源", safe(currentDraw.source || "official"))}
          ${metric("號碼數量", fmtNumber(system.numbers_count || normalizeNumbers(currentDraw.numbers).length))}
        </div>
        <h3>號碼</h3>${balls(currentDraw.numbers)}
        <h3>超級獎號</h3>${currentDraw.super_number ? balls([currentDraw.super_number], "super") : `<div class="empty">尚無資料</div>`}
      `;
    }

    function wakeStatusText(status) {
      if (status === "healthy") return "正常";
      if (status === "delayed") return "可能延遲";
      if (status === "at_risk") return "即將休眠";
      return "尚無資料";
    }

    function wakeStatusClass(status) {
      if (status === "healthy") return "status-ok";
      if (status === "delayed") return "status-warning";
      if (status === "at_risk") return "status-error";
      return "status-unknown";
    }

    function renderWake(wake, latestSync) {
      const status = wake.wake_status || "unknown";
      const seconds = Number(wake.seconds_since_last_health_request);
      const minutes = Number.isFinite(seconds) ? Math.floor(seconds / 60) : null;
      const warning = status === "at_risk"
        ? `<div class="notice bad">外部喚醒可能已失效，Render 免費服務可能因閒置而休眠。</div>`
        : "";
      const restarted = latestSync.latest_saved_at && wake.instance_started_at
        && new Date(wake.instance_started_at).getTime() > new Date(latestSync.latest_saved_at).getTime();
      const restartNotice = restarted
        ? `<div class="notice warn">服務剛重新啟動，休眠期間的排程可能未執行。</div>`
        : "";
      document.getElementById("cardWake").innerHTML = `
        <h2>外部喚醒狀態</h2>
        <div class="grid">
          ${metric("狀態", wakeStatusText(status), wakeStatusClass(status))}
          ${metric("最後 health request", formatDateTime(wake.last_health_request_at))}
          ${metric("距今幾分鐘", minutes === null ? "尚無資料" : `${fmtNumber(minutes)} 分鐘`)}
          ${metric("Wake source", safe(wake.wake_source))}
          ${metric("Instance 啟動時間", formatDateTime(wake.instance_started_at))}
          ${metric("本次啟動 request 數", fmtNumber(wake.health_request_count_since_start))}
        </div>
        ${warning}
        ${restartNotice}
      `;
    }

    function renderContinuity(gaps) {
      const status = gaps.continuity_status || gaps.status || "unknown";
      const missingCount = Number(gaps.missing_count || asList(gaps.missing_issues).length || 0);
      document.getElementById("cardContinuity").innerHTML = `
        <h2>資料連續性檢查</h2>
        <div class="grid">
          ${metric("連續性", statusText(status), statusClass(status === "complete" ? "ok" : status))}
          ${metric("缺漏期數", fmtNumber(missingCount), missingCount ? "status-warning" : "status-ok")}
          ${metric("待驗證", fmtNumber(gaps.pending_verification_count))}
          ${metric("異常資料", fmtNumber(asList(gaps.invalid_issues).length))}
          ${metric("檢查範圍", `${safe(gaps.start_issue)} - ${safe(gaps.end_issue)}`)}
          ${metric("最後檢查", safe(gaps.checked_at))}
        </div>
        <h3>缺漏期數</h3>${chips(asList(gaps.missing_issues).slice(0, 20))}
      `;
    }

    function renderPipeline(health, collectorStatus) {
      const components = Object.entries(health.components || {}).map(([name, item]) =>
        row(name, `${statusText(item.status || "unknown")} / ${fmtNumber(item.duration_ms)}ms`, statusClass(item.status))
      );
      document.getElementById("cardPipeline").innerHTML = `
        <h2>Pipeline 同步狀態</h2>
        <div class="grid">
          ${metric("整體狀態", statusText(health.status || "unknown"), statusClass(health.status))}
          ${metric("Pipeline", statusText(health.pipeline_status || "unknown"), statusClass(health.pipeline_status))}
          ${metric("總耗時", `${fmtNumber(health.total_duration_ms)} ms`)}
          ${metric("Trigger 今日", fmtNumber(health.prediction_trigger_count_today))}
          ${metric("Service Call 今日", fmtNumber(health.prediction_service_call_count_today))}
          ${metric("排程註冊", health.prediction_job_registered ? "已註冊" : "尚未註冊", health.prediction_job_registered ? "status-ok" : "status-warning")}
          ${metric("排程最後狀態", safe(health.prediction_job_last_status))}
          ${metric("排程最後錯誤", safe(health.prediction_job_last_error, "無"))}
          ${metric("等待驗證", fmtNumber(health.live_verification_pending))}
          ${metric("等待學習", fmtNumber(health.live_learning_pending))}
          ${metric("Null Target", fmtNumber(health.null_target_count || health.null_target_today))}
          ${metric("Schedule Coverage", `${fmtNumber(health.schedule_coverage)}%`)}
        </div>
        <h3>Components</h3>${components.length ? rows(components) : `<div class="empty">尚無資料</div>`}
      `;
    }

    function renderOfficial(official) {
      document.getElementById("cardOfficial").innerHTML = `
        <h2>官方驗證中心</h2>
        <div class="grid">
          ${metric("最新官方期數", safe(official.latest_official_issue))}
          ${metric("最新快手期數", safe(official.latest_kuaishou_issue))}
          ${metric("驗證率", `${fmtNumber(official.verified_rate)}%`, Number(official.verified_rate) >= 99 ? "status-ok" : "status-warning")}
          ${metric("已驗證", fmtNumber(official.verified_count))}
          ${metric("Mismatch", fmtNumber(official.mismatch_count), Number(official.mismatch_count) ? "status-error" : "status-ok")}
          ${metric("等待官方", fmtNumber(official.waiting_count || official.waiting_official_count))}
        </div>
      `;
    }

    function renderOperations(ops) {
      const summary = ops.error_summary || {};
      const unresolved = Number(summary.unresolved || 0);
      document.getElementById("cardOperations").innerHTML = `
        <h2>AI Operations Center</h2>
        <div class="grid">
          ${metric("營運狀態", statusText(ops.status || "unknown"), statusClass(ops.status))}
          ${metric("未解決錯誤", fmtNumber(unresolved), unresolved ? "status-error" : "status-ok")}
          ${metric("已解決錯誤", fmtNumber(summary.resolved))}
          ${metric("總錯誤數", fmtNumber(summary.total))}
        </div>
        <h3>最近事件</h3>
        ${rows(asList(ops.timeline).slice(0, 5).map((event) => row(safe(event.component), `${safe(event.status)} / ${safe(event.issue)}`, statusClass(event.status))))}
      `;
    }

    function renderEvolution(evolution, history) {
      const weights = evolution.recommended_weights || evolution.weights || {};
      const weightRows = Object.entries(weights).map(([key, value]) => row(key, percent(value)));
      const versions = asList(history.items || history.history).slice(0, 5).map((item) => row(`V${safe(item.version)}`, `平均 ${fmtNumber(item.average_hits)} / Super ${percent(item.super_hit_rate)}`));
      document.getElementById("cardEvolution").innerHTML = `
        <h2>AI Evolution</h2>
        <div class="grid">
          ${metric("目前版本", safe(evolution.version))}
          ${metric("平均命中", fmtNumber(evolution.average_hits))}
          ${metric("Super Hit", percent(evolution.super_hit_rate))}
          ${metric("Candidate", evolution.candidate ? "YES" : "NO", evolution.candidate ? "status-ok" : "status-unknown")}
        </div>
        <h3>建議權重</h3>${weightRows.length ? rows(weightRows) : `<div class="empty">尚無 Evolution 權重</div>`}
        <h3>Version History</h3>${versions.length ? rows(versions) : `<div class="empty">尚無版本歷史</div>`}
      `;
    }

    document.getElementById("refreshButton").addEventListener("click", loadAll);
    if (document.visibilityState === "visible") {
      startVisiblePolling({ initial: true });
    } else {
      startHiddenPolling();
    }
  </script>
</body>
</html>
