<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bingo AI 智慧預測中心</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111c;
      --panel: #101c28;
      --panel-soft: #162638;
      --text: #f4f8ff;
      --muted: #9fb1c8;
      --line: #284058;
      --ok: #2fd17c;
      --warn: #f6c344;
      --bad: #ff6478;
      --accent: #59c7ff;
      --super: #ffd166;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 16% 0%, rgba(89, 199, 255, .18), transparent 32%),
        radial-gradient(circle at 85% 4%, rgba(47, 209, 124, .10), transparent 30%),
        linear-gradient(180deg, #07111c 0%, #0b1724 100%);
      color: var(--text);
      font-family: Arial, "Microsoft JhengHei", "PingFang TC", sans-serif;
      line-height: 1.55;
    }

    main {
      width: min(780px, 100%);
      margin: 0 auto;
      padding: 18px 12px 42px;
    }

    header {
      padding: 10px 4px 18px;
    }

    h1 {
      margin: 0;
      font-size: 29px;
      line-height: 1.22;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 20px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    h3 {
      margin: 16px 0 8px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #1c344a;
      color: var(--text);
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 800;
    }

    .card {
      width: 100%;
      margin-bottom: 14px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(16, 28, 40, .96);
      box-shadow: 0 16px 36px rgba(0, 0, 0, .24);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      min-width: 0;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 10px;
      background: var(--panel-soft);
    }

    .metric .label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .metric .value {
      font-size: 20px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .balls, .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .ball {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 46px;
      height: 38px;
      padding: 0 12px;
      border-radius: 999px;
      background: #243d55;
      border: 1px solid rgba(255,255,255,.08);
      color: var(--text);
      font-size: 18px;
      font-weight: 900;
    }

    .ball.super {
      border-color: rgba(255, 100, 120, .95);
      background: rgba(255, 100, 120, .18);
      color: #ffb3bf;
      box-shadow: 0 0 0 3px rgba(255, 100, 120, .16);
    }

    .ball.hit {
      background: #f6c344;
      color: #111827;
      border-color: rgba(255, 255, 255, .28);
      box-shadow: 0 0 0 3px rgba(246, 195, 68, .18);
    }

    .card-two-shell {
      display: grid;
      gap: 14px;
    }

    .card-two-title {
      display: grid;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .card-two-summary {
      display: grid;
      gap: 10px;
    }

    .card-two-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .card-two-pill {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 6px 10px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      background: rgba(22, 38, 56, .82);
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .card-two-pill-finalized {
      border-color: rgba(47, 209, 124, .34);
      background: rgba(47, 209, 124, .14);
      color: var(--ok);
    }

    .card-two-numbers {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
    }

    .card-two-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      height: 36px;
      padding: 0 10px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 999px;
      background: #243d55;
      color: var(--text);
      font-size: 17px;
      font-weight: 900;
    }

    .card-two-number-hit {
      border-color: rgba(255, 255, 255, .28);
      background: #f6c344;
      color: #111827;
      box-shadow: 0 0 0 3px rgba(246, 195, 68, .18);
    }

    .card-two-number-super {
      border-color: rgba(255, 100, 120, .95);
      color: #ffb3bf;
      box-shadow: 0 0 0 3px rgba(255, 100, 120, .16);
    }

    .card-two-number-hit.card-two-number-super {
      color: #7f1d1d;
    }

    .card-two-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 2px;
      border-color: rgba(89, 199, 255, .28);
      background: #1c344a;
      text-align: left;
      cursor: pointer;
    }

    .analysis-report-list {
      display: grid;
      gap: 10px;
    }

    .analysis-report-rule {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px;
      background: var(--panel-soft);
    }

    .analysis-report-rule-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-weight: 900;
    }

    .analysis-report-field {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .analysis-report-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .analysis-report-text {
      overflow-wrap: anywhere;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #1d3144;
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
    }

    .list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 10px;
      background: var(--panel-soft);
    }

    .row span:last-child {
      text-align: right;
      font-weight: 800;
    }

    .empty, .notice {
      padding: 13px;
      border-radius: 10px;
      background: #162433;
      color: var(--muted);
    }

    .notice.warn { color: var(--warn); }
    .notice.bad { color: var(--bad); }
    .notice.ok { color: var(--ok); }

    .status-ok { color: var(--ok); }
    .status-warning { color: var(--warn); }
    .status-error { color: var(--bad); }
    .status-unknown { color: var(--muted); }

    .bar {
      height: 10px;
      border-radius: 999px;
      background: #263849;
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--ok), var(--warn), var(--bad));
    }

    .collapse-button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      text-align: left;
      cursor: pointer;
    }

    .summary-line {
      color: var(--muted);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .next-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 10px;
    }

    .next-card-header h2 {
      margin-bottom: 3px;
    }

    .next-issue {
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }

    .confidence-badge {
      flex: 0 0 auto;
      padding: 8px 12px;
      border: 1px solid rgba(47, 209, 124, .34);
      border-radius: 999px;
      background: rgba(47, 209, 124, .14);
      color: var(--ok);
      font-size: 15px;
      font-weight: 900;
      white-space: nowrap;
    }

    .quick-status {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .status-pill {
      padding: 5px 9px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      background: rgba(22, 38, 56, .74);
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .compact-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .card1-title {
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .card1-title h2 {
      margin-bottom: 4px;
    }

    #cardNext {
      height: 1080px;
      overflow-y: auto;
    }

    #cardNext .number-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .card1-section {
      padding: 14px 0;
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .card1-section:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .card1-section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .card1-section-title h3 {
      margin: 0;
      color: var(--text);
      font-size: 16px;
    }

    .card1-info-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 11px 12px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 10px;
      background: var(--panel-soft);
      font-weight: 900;
    }

    .card1-info-line .summary-line {
      margin-top: 3px;
      font-weight: 500;
    }

    .card1-fixed-row {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 7px 0;
      font-weight: 900;
    }

    .card1-fixed-row span:first-child {
      color: var(--muted);
    }

    .card1-signal-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .card1-signal {
      min-height: 78px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 10px;
      background: var(--panel-soft);
    }

    .card1-signal span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .card1-signal strong {
      display: block;
      margin-top: 4px;
      font-size: 22px;
      line-height: 1.2;
    }

    .number-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .number-grid .ball {
      width: 100%;
      min-width: 0;
    }

    .rule-snapshot-list {
      display: grid;
      gap: 8px;
    }

    .rule-snapshot-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
      padding: 9px 10px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 8px;
      background: var(--panel-soft);
      font-size: 13px;
    }

    .compact-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .compact-heading h3 {
      margin: 0;
      color: var(--text);
    }

    .compact-note {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .ball.featured {
      min-width: 54px;
      height: 44px;
      border-color: rgba(89, 199, 255, .32);
      background: #2a4a65;
      color: #f7fbff;
      font-size: 20px;
      box-shadow: 0 0 0 3px rgba(89, 199, 255, .08);
    }

    .trend-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .trend-summary.single {
      grid-template-columns: 1fr;
    }

    .trend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 10px;
      background: var(--panel-soft);
    }

    .trend-item span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .trend-item strong {
      text-align: right;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .section {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .mini-title {
      margin: 0 0 8px;
      color: var(--text);
      font-size: 15px;
      font-weight: 900;
    }

    .rule-list {
      display: grid;
      gap: 10px;
    }

    .rule-item {
      padding: 12px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 10px;
      background: var(--panel-soft);
    }

    .rule-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .muted {
      color: var(--muted);
    }

    details {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      background: rgba(16, 28, 40, .72);
    }

    summary {
      cursor: pointer;
      color: var(--muted);
      font-weight: 800;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: var(--muted);
      font-size: 12px;
    }

    @media (min-width: 720px) {
      main { padding-top: 28px; }
      h1 { font-size: 34px; }
      .card { padding: 22px; }
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 520px) {
      main { padding-left: 10px; padding-right: 10px; padding-bottom: 72px; }
      h1 { font-size: 26px; }
      .card { padding: 14px; border-radius: 10px; }
      .grid { grid-template-columns: 1fr; }
      .ball {
        min-width: 40px;
        height: 36px;
        padding: 0 10px;
        font-size: 16px;
      }
      .metric .value { font-size: 18px; }
      .row { align-items: flex-start; }
      .row span:last-child { max-width: 58%; }
      .next-card-header { flex-direction: column; align-items: stretch; }
      .confidence-badge { align-self: flex-start; }
      .ball.featured {
        min-width: 46px;
        height: 40px;
        font-size: 18px;
      }
      .number-grid { gap: 6px; }
      .card-two-number {
        min-width: 38px;
        height: 34px;
        padding: 0 9px;
        font-size: 16px;
      }
      .card-two-meta { align-items: flex-start; }
      .card1-section-title { align-items: flex-start; flex-direction: column; }
      .card1-info-line { justify-content: flex-start; }
      .rule-snapshot-row { grid-template-columns: 1fr; }
      .trend-summary { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Bingo AI 智慧預測中心</h1>
      <div class="subtitle">打開首頁 5 秒內看懂下一期推薦、老玩家模式、資料同步與 AI 成績。</div>
      <div class="toolbar">
        <button type="button" id="refreshButton">重新整理</button>
        <span id="refreshState">載入中</span>
      </div>
    </header>

    <div id="errorBox" class="notice warn" style="display:none"></div>

    <section>
      <article class="card" id="cardNext"></article>
      <article class="card" id="cardTwo"></article>
      <article class="card" id="cardReasons"></article>
    </section>

  </main>

  <script>
    const API_TIMEOUT_MS = 10000;
    const CARD_TWO_STORAGE_KEY = "bingo-ai-card-two-cache";
    let cardOneCommittedHtml = "";
    const DASHBOARD_TAB_ID = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    const DASHBOARD_LEADER_KEY = "bingo-ai-dashboard-leader";
    const DASHBOARD_LEADER_TTL_MS = 30 * 1000;
    const DASHBOARD_LEADER_HEARTBEAT_MS = 10 * 1000;
    const DASHBOARD_PLAYER_SUMMARY_INTERVAL_MS = 120 * 1000;

    const apis = {
      playerSummary: "/api/dashboard/player-summary"
    };

    const pollState = {
      latest: {},
      timers: [],
      inFlight: {},
      isLeader: false,
      leaderHeartbeatTimer: null,
      broadcast: null
    };

    const zhStatus = {
      ok: "正常",
      warning: "警告",
      error: "錯誤",
      unknown: "未知",
      running: "執行中",
      available: "可用",
      ready: "已準備",
      waiting_draw: "等待開獎",
      verified: "已驗證",
      learned: "已學習",
      expired: "已過期",
      failed: "失敗",
      skipped_due_to_lock: "前一輪仍在執行",
      complete: "完整",
      incomplete: "不完整"
    };

    Object.assign(zhStatus, {
      ready: "等待開獎",
      waiting_draw: "等待開獎",
      waiting_refresh: "等待同步",
      verified: "已驗證",
      learned: "已學習",
      expired: "已過期",
      unavailable: "尚無資料"
    });

    const officialStatusText = (status) => {
      if (status === "verified" || status === "official_verified") return "🟢 官方已驗證";
      if (status === "pending" || status === "pending_verification") return "待驗證";
      return "待驗證";
    };

    const normalizeOfficialStatus = (status) => {
      if (status === "official_verified") return "verified";
      if (["verified", "pending", "pending_verification", "unknown"].includes(status)) return status;
      return "unknown";
    };

    const safe = (value, fallback = "尚無資料") => {
      if (value === null || value === undefined || value === "" || Number.isNaN(value)) return fallback;
      return String(value);
    };

    const escapeHtml = (value) => safe(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

    const cardTwoText = (value, fallback = "尚無資料") => escapeHtml(safe(value, fallback));

    const asList = (value) => Array.isArray(value) ? value : [];

    const fmtNumber = (value, fallback = "0") => {
      const n = Number(value);
      if (!Number.isFinite(n)) return fallback;
      return n.toFixed(2).replace(/\.?0+$/, "");
    };

    const confidencePercentValue = (value, fallback = 0) => {
      const n = Number(value);
      if (!Number.isFinite(n)) return fallback;
      return Math.max(0, Math.min(100, n > 1 ? n : n * 100));
    };

    const statusText = (status) => zhStatus[status] || safe(status);

    const statusClass = (status) => {
      if (["ok", "complete", "ready", "verified", "learned", "available", "running"].includes(status)) return "status-ok";
      if (["warning", "waiting_draw", "skipped_due_to_lock", "incomplete"].includes(status)) return "status-warning";
      if (["error", "expired", "failed"].includes(status)) return "status-error";
      return "status-unknown";
    };

    const zhMap = {
      stable: "穩定",
      high: "高",
      moderate: "普通",
      low: "較低",
      good: "良好",
      excellent: "極佳",
      strong: "優良",
      no_hit: "未命中",
      big: "偏大",
      large: "偏大",
      small: "偏小",
      odd: "偏單",
      even: "偏雙",
      balanced: "均衡",
      unavailable: "尚無資料",
      Balance: "均衡模型",
      HotCold: "冷熱模型",
      Missing: "缺號模型",
      Pattern: "型態模型",
      laowanjia: "老玩家模型"
    };

    const labelZh = (value) => zhMap[value] || safe(value);
    const numberLabel = (value) => String(Number(value)).padStart(2, "0");
    const normalizeNumbers = (values) => {
      const source = Array.isArray(values) ? values : [];
      return [...new Set(source.map((value) => Number(value)).filter((number) => Number.isInteger(number) && number >= 1 && number <= 80))]
        .sort((a, b) => a - b);
    };

    const normalizeNumbersInOrder = (values) => {
      const source = Array.isArray(values) ? values : [];
      const seen = new Set();
      return source.map((value) => Number(value))
        .filter((number) => {
          if (!Number.isInteger(number) || number < 1 || number > 80 || seen.has(number)) return false;
          seen.add(number);
          return true;
        });
    };

    const issueNumber = (value) => {
      if (value === null || value === undefined || value === "") return null;
      const text = String(value).trim();
      if (!/^\d+$/.test(text)) return null;
      const number = Number(text);
      return Number.isSafeInteger(number) && number > 0 ? number : null;
    };

    const hasValidNumberSet = (values, expectedCount) => (
      Array.isArray(values)
      && values.length === expectedCount
      && normalizeNumbers(values).length === expectedCount
    );

    const hasDisplayableDateTime = (value) => {
      if (!value) return false;
      const rawText = String(value).trim();
      const slashDate = rawText.match(/^(\d{4})\/(\d{2})\/(\d{2})\s+(.+)$/);
      const normalized = slashDate
        ? `${slashDate[1]}-${slashDate[2]}-${slashDate[3]}T${slashDate[4]}`
        : (rawText.includes(" ") ? rawText.replace(" ", "T") : rawText);
      return !Number.isNaN(new Date(normalized).getTime());
    };

    const formatDateTime = (value) => {
      if (!value) return "尚無資料";
      const rawText = String(value).trim();
      const slashDate = rawText.match(/^(\d{4})\/(\d{2})\/(\d{2})\s+(.+)$/);
      const normalized = slashDate
        ? `${slashDate[1]}-${slashDate[2]}-${slashDate[3]}T${slashDate[4]}`
        : (rawText.includes(" ") ? rawText.replace(" ", "T") : rawText);
      const date = new Date(normalized);
      if (Number.isNaN(date.getTime())) return safe(value);
      const parts = new Intl.DateTimeFormat("zh-TW", {
        timeZone: "Asia/Taipei",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      }).formatToParts(date).reduce((acc, part) => {
        acc[part.type] = part.value;
        return acc;
      }, {});
      return `${parts.year}/${parts.month}/${parts.day} ${parts.dayPeriod || ""}${parts.hour}:${parts.minute}:${parts.second}`;
    };

    const formatTimeOnly = (value) => {
      if (!value) return "尚無資料";
      const rawText = String(value).trim();
      const slashDate = rawText.match(/^(\d{4})\/(\d{2})\/(\d{2})\s+(.+)$/);
      const normalized = slashDate
        ? `${slashDate[1]}-${slashDate[2]}-${slashDate[3]}T${slashDate[4]}`
        : (rawText.includes(" ") ? rawText.replace(" ", "T") : rawText);
      const date = new Date(normalized);
      if (Number.isNaN(date.getTime())) return safe(value);
      return new Intl.DateTimeFormat("zh-TW", {
        timeZone: "Asia/Taipei",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(date);
    };

    const metric = (label, value, extraClass = "") => `
      <div class="metric">
        <div class="label">${label}</div>
        <div class="value ${extraClass}">${value}</div>
      </div>
    `;

    const balls = (values, type = "", hitValues = []) => {
      const hits = new Set(normalizeNumbers(hitValues));

      if (!items.length) return `<div class="empty">尚無資料</div>`;
      return `<div class="balls">${items.map((n) => `<span class="ball ${type} ${hits.has(Number(n)) ? "hit" : ""}">${numberLabel(n)}</span>`).join("")}</div>`;
    };

    const ballsInOrder = (values, type = "", hitValues = []) => {
      const hits = new Set(normalizeNumbers(hitValues));
      const items = normalizeNumbersInOrder(values);
      if (!items.length) return `<div class="empty">尚無資料</div>`;
      return `<div class="balls">${items.map((n) => `<span class="ball ${type} ${hits.has(Number(n)) ? "hit" : ""}">${numberLabel(n)}</span>`).join("")}</div>`;
    };

    const chips = (values) => {
      const items = asList(values).filter((item) => item !== null && item !== undefined && item !== "");
      if (!items.length) return `<div class="empty">尚無資料</div>`;
      return `<div class="chips">${items.map((item) => `<span class="chip">${Array.isArray(item) ? item.map(numberLabel).join("、") : safe(item)}</span>`).join("")}</div>`;

    const row = (label, value, cls = "") => `<div class="row"><span>${label}</span><span class="${cls}">${value}</span></div>`;

    const numberGrid = (values, type = "", hitValues = [], hitClass = "hit") => {
      const hits = new Set(normalizeNumbers(hitValues));
      const items = normalizeNumbers(values);
      if (!items.length) return `<div class="empty">尚無資料</div>`;
      return `<div class="number-grid">${items.map((n) => `<span class="ball ${type} ${hits.has(Number(n)) ? hitClass : ""}">${numberLabel(n)}</span>`).join("")}</div>`;
    };

    const cardTwoNumbers = (values, hitValues = [], superNumber = null) => {
      const hits = new Set(normalizeNumbers(hitValues));

      return `<div class="card-two-numbers">${items.map((n) => {
        const classes = ["card-two-number"];
        if (hits.has(Number(n))) classes.push("card-two-number-hit");
        if (superValue === Number(n)) classes.push("card-two-number-super");
        return `<span class="${classes.join(" ")}">${numberLabel(n)}</span>`;
      }).join("")}</div>`;
    };

    function saveCardTwoBrowserCache(cardTwo) {
      if (!cardTwo || cardTwo.available !== true) return;
      try {
        localStorage.setItem(CARD_TWO_STORAGE_KEY, JSON.stringify({ saved_at: Date.now(), payload: cardTwo }));
      } catch (error) {
        console.warn("[dashboard] card two browser cache save failed", error);

    }

    function loadCardTwoBrowserCache() {
      try {
        const raw = localStorage.getItem(CARD_TWO_STORAGE_KEY);
        if (!raw) return null;
        const cached = JSON.parse(raw);
        if (!cached || !cached.payload || cached.payload.available !== true) return null;
        return { ...cached.payload, update_hint: "資料更新中" };
      } catch (error) {
        console.warn("[dashboard] card two browser cache load failed", error);
        return null;
      }
    }

    function normalizeCardTwo(data) {
      const player = data.playerSummary && data.playerSummary.status === "ok" ? data.playerSummary : null;
      const raw = player && player.card_two ? player.card_two : null;
      const componentMeta = raw && raw._component_metadata
        ? raw._component_metadata
        : (player && player.meta && player.meta.components && player.meta.components.card_two) || {};
      if (raw && raw.available === true) {
        raw.component_metadata = componentMeta;
        saveCardTwoBrowserCache(raw);
        return raw;
      }
      if (raw) raw.component_metadata = componentMeta;
      if (raw) return raw;
      if (player) {
        return {

        };

        available: false,
        status_text: "尚無已完成的最終分析報告",
        fallback_text: "AI 正在等待足夠的正式開獎與驗證資料。",

        matched_numbers: [],
        rules: []
      };

    function normalizeCardThree(data) {

      return {

    const CARD1_RULE_ORDER = [
      ["hot", "熱門"],
      ["cold", "冷門"],
      ["missing", "缺號"],
      ["repeat", "重號"],
      ["tail", "尾數"],
      ["gap", "間距"],
      ["cluster", "群聚"],
      ["diagonal", "斜線"],
      ["super", "超級獎", "super_number_trajectory_recovery"],

      ["ladder", "階梯"],
      ["partial_ladder", "偏階"],
      ["extended_ladder", "延階"],
      ["reverse", "反號"],
      ["neighbor", "隔壁號"],
      ["guide", "引路牌"],
      ["integrated", "整合數"],
      ["sunset", "太陽下山"],
      ["momentum", "盤勢動能"]

    function hasDisplayableHighProbability(next, predictionNumbers) {
      const raw = (next || {}).raw_high_probability_numbers;
      const numbers = normalizeNumbers(raw);
      const predictionSet = new Set(normalizeNumbers(predictionNumbers));
      return Array.isArray(raw)
        && raw.length > 0
        && raw.length <= 5
        && numbers.length === raw.length
        && numbers.every((number) => predictionSet.has(number));
    }

    function renderCompactHighProbability(next, predictionNumbers) {
      if (!hasDisplayableHighProbability(next, predictionNumbers)) return "";

    function hasRuleSnapshotData(rule) {
      if (!rule) return false;
      if (normalizeNumbers(rule.candidate_numbers).length) return true;
      if (rule.reason) return true;
      if (rule.score !== undefined && rule.score !== null) return true;
      if (rule.confidence !== undefined && rule.confidence !== null) return true;
      return ["ready", "experimental"].includes(rule.status);
    }

    function renderRuleSnapshotPreview(ruleLibrary) {
      const sourceRules = asList((ruleLibrary || {}).rules);
      const rulesByKey = sourceRules.reduce((acc, rule) => {
        const key = rule && rule.key ? String(rule.key) : "";
        if (key && !acc[key]) acc[key] = rule;
        return acc;
      }, {});
      const rules = CARD1_RULE_ORDER
        .map(([key, label, alias]) => {
          const rule = [rulesByKey[key], rulesByKey[alias]].find(hasRuleSnapshotData);
          return rule ? { ...rule, display_label: label } : null;
        })
        .filter(Boolean);
      if (!rules.length) return `<div class="empty">AI 推薦依據整理中</div>`;
      return `
        <div class="rule-snapshot-list">
          ${rules.map((rule) => `
            <div class="rule-snapshot-row">
              <strong>${safe(rule.display_label)}</strong>
              <span>${rule.score === undefined || rule.score === null ? "資料已整理" : `信心 ${fmtNumber(rule.score)}%`}</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    function hasDisplayableConfidence(next) {
      return Boolean(next && next.confidence_available)
        && Number.isFinite(Number(next.confidence_percent));
    }

    function renderCardOneSignals(next) {
      const meta = next && next.component_metadata ? next.component_metadata : {};
      if (meta.stale === true || meta.source === "cache" || meta.source === "fallback") {
        return `
          <div class="card1-signal-grid">
            <div class="card1-signal"><span>大小：</span><strong>資料同步中</strong></div>
            <div class="card1-signal"><span>單雙：</span><strong>資料同步中</strong></div>
            <div class="card1-signal"><span>AI信心：</span><strong>資料同步中</strong></div>
          </div>
        `;
      }
      const sizeLabel = next && next.size_prediction ? labelZh(next.size_prediction.label) : "資料整理中";
      const oddEvenLabel = next && next.odd_even_prediction ? labelZh(next.odd_even_prediction.label) : "資料整理中";
      const confidenceLabel = hasDisplayableConfidence(next) ? `${fmtNumber(next.confidence_percent)}%` : "資料整理中";
      return `
        <div class="card1-signal-grid">
          <div class="card1-signal"><span>大小：</span><strong>${sizeLabel}</strong></div>
          <div class="card1-signal"><span>單雙：</span><strong>${oddEvenLabel}</strong></div>
          <div class="card1-signal"><span>AI信心：</span><strong>${confidenceLabel}</strong></div>
        </div>
      `;
    }

    function isCompleteOfficialDraw(officialDraw) {
      const issue = issueNumber((officialDraw || {}).issue);
      const numbers = normalizeNumbers((officialDraw || {}).raw_numbers);
      const superNumber = normalizeNumbers([(officialDraw || {}).super_number])[0];
      return Boolean(issue)
        && normalizeOfficialStatus((officialDraw || {}).verification_status) === "verified"
        && hasValidNumberSet((officialDraw || {}).raw_numbers, 20)
        && Boolean(superNumber)
        && numbers.includes(superNumber)
        && hasDisplayableDateTime((officialDraw || {}).draw_time);
    }

    function isCompletePrediction(next) {
      const targetIssue = issueNumber((next || {}).prediction_issue);
      const sourceIssue = issueNumber((next || {}).based_on_issue);
      const ruleLibrary = (next || {}).rule_library || {};
      return Boolean(targetIssue)
        && Boolean(sourceIssue)
        && targetIssue > sourceIssue
        && hasDisplayableDateTime((next || {}).based_on_draw_time)
        && hasValidNumberSet((next || {}).raw_candidates, 20)
        && Array.isArray(ruleLibrary.rules);
    }

    function isCardOneIssueAligned(officialDraw, next) {
      const officialIssue = issueNumber((officialDraw || {}).issue);
      const sourceIssue = issueNumber((next || {}).based_on_issue);
      return Boolean(officialIssue) && officialIssue === sourceIssue;
    }

    async function loadJson(key, url, timeoutMs = API_TIMEOUT_MS) {
      if (pollState.inFlight[key]) {
        return { __skipped: true, status: "skipped", reason: "request_in_flight" };
      }
      pollState.inFlight[key] = true;
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { cache: "no-store", signal: controller.signal });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        return payload;
      } catch (error) {
        const message = error && error.name === "AbortError"
          ? `${url} timeout after ${timeoutMs / 1000}s`
          : `${url} ${error && error.message ? error.message : error}`;
        console.warn("[dashboard] API failed", { endpoint: url, error: message });
        return { status: "unknown", unavailable: true, error: message };
      } finally {
        clearTimeout(timer);
        pollState.inFlight[key] = false;
      }
    }

    async function loadApiGroup(keys, renderAfter = true) {
      if (document.visibilityState !== "visible" || !pollState.isLeader) return;
      document.getElementById("refreshState").textContent = "Loading";
      const loaded = await Promise.allSettled(
        keys.map(async (key) => [key, await loadJson(key, apis[key])])
      );
      const errors = [];
      for (const entry of loaded) {
        if (entry.status === "fulfilled") {
          const [key, payload] = entry.value;
          if (payload && payload.__skipped) continue;
          pollState.latest[key] = payload;
        } else {
          errors.push(entry.reason && entry.reason.message ? entry.reason.message : String(entry.reason));
        }
      }
      if (renderAfter) render(pollState.latest, errors);
      publishDashboardSnapshot();
      document.getElementById("refreshState").textContent = `Updated ${new Date().toLocaleString()}`;
    }

    function safeReadLeaderLease() {
      try {
        return JSON.parse(localStorage.getItem(DASHBOARD_LEADER_KEY) || "null");
      } catch (error) {
        return null;
      }
    }

    function safeWriteLeaderLease() {
      try {
        localStorage.setItem(DASHBOARD_LEADER_KEY, JSON.stringify({
          tabId: DASHBOARD_TAB_ID,
          expiresAt: Date.now() + DASHBOARD_LEADER_TTL_MS,
          updatedAt: Date.now()
        }));
        return true;
      } catch (error) {
        return false;
      }
    }

    function ensurePollingLeader() {
      if (document.visibilityState !== "visible") {
        pollState.isLeader = false;
        return false;
      }
      const lease = safeReadLeaderLease();
      const now = Date.now();
      if (!lease || lease.tabId === DASHBOARD_TAB_ID || Number(lease.expiresAt || 0) <= now) {
        pollState.isLeader = safeWriteLeaderLease();
      } else {
        pollState.isLeader = false;
      }
      return pollState.isLeader;
    }

    function startLeaderHeartbeat() {
      if (pollState.leaderHeartbeatTimer) clearInterval(pollState.leaderHeartbeatTimer);
      pollState.leaderHeartbeatTimer = setInterval(() => {
        if (!ensurePollingLeader()) {
          stopPolling();
          return;
        }
        safeWriteLeaderLease();
      }, DASHBOARD_LEADER_HEARTBEAT_MS);
    }

    function publishDashboardSnapshot() {
      const message = { type: "dashboard-snapshot", latest: pollState.latest, at: Date.now(), tabId: DASHBOARD_TAB_ID };
      if (pollState.broadcast) {
        try {
          pollState.broadcast.postMessage(message);
        } catch (error) {
          console.warn("[dashboard] broadcast failed", error);
        }
      }
      try {
        localStorage.setItem("bingo-ai-dashboard-snapshot", JSON.stringify(message));
      } catch (error) {
        console.warn("[dashboard] snapshot save failed", error);
      }
    }

    function receiveDashboardSnapshot(message) {
      if (!message || message.type !== "dashboard-snapshot" || message.tabId === DASHBOARD_TAB_ID) return;
      if (!message.latest || typeof message.latest !== "object") return;
      pollState.latest = message.latest;
      render(pollState.latest, []);
      document.getElementById("refreshState").textContent = `Updated ${new Date().toLocaleString()}`;
    }

    function scheduleTimer(callback, delayMs) {
      const timer = setInterval(callback, delayMs);
      pollState.timers.push(timer);
      return timer;
    }

    function stopPolling() {
      pollState.timers.forEach((timer) => clearInterval(timer));
      pollState.timers = [];
      if (pollState.leaderHeartbeatTimer) clearInterval(pollState.leaderHeartbeatTimer);
      pollState.leaderHeartbeatTimer = null;
    }

    function startVisiblePolling() {
      stopPolling();
      if (!ensurePollingLeader()) return;
      startLeaderHeartbeat();
      loadApiGroup(["playerSummary"]);
      scheduleTimer(() => loadApiGroup(["playerSummary"]), DASHBOARD_PLAYER_SUMMARY_INTERVAL_MS);
    }

    function startHiddenPolling() {
      stopPolling();
      pollState.isLeader = false;
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        startVisiblePolling();
      } else {
        startHiddenPolling();
      }
    });

    if (typeof BroadcastChannel !== "undefined") {
      pollState.broadcast = new BroadcastChannel("bingo-ai-dashboard-traffic");
      pollState.broadcast.onmessage = (event) => receiveDashboardSnapshot(event.data);
    }

    if (typeof window !== "undefined" && typeof window.addEventListener === "function") {
      window.addEventListener("storage", (event) => {
        if (event.key === "bingo-ai-dashboard-snapshot" && event.newValue) {
          try {
            receiveDashboardSnapshot(JSON.parse(event.newValue));
          } catch (error) {
            console.warn("[dashboard] snapshot parse failed", error);
          }
        }
        if (event.key === DASHBOARD_LEADER_KEY && document.visibilityState === "visible" && !pollState.isLeader) {
          const lease = safeReadLeaderLease();
          if (!lease || Number(lease.expiresAt || 0) <= Date.now()) startVisiblePolling();
        }
      });
    }

    function componentStateNotice(meta) {
      const payload = meta || {};
      if (payload.result === "error" || payload.source === "fallback") return `<div class="notice warn">資料暫時無法更新</div>`;
      if (payload.stale === true && payload.source !== "cache") return `<div class="notice warn">資料同步中</div>`;
      if (payload.source === "cache" || payload.timed_out === true) return `<div class="notice warn">暫用上一筆資料</div>`;
      return "";
    }

    function normalizeNext(data) {
      const player = data.playerSummary && data.playerSummary.status === "ok" ? data.playerSummary : null;
      const cardOne = player && player.card_one ? player.card_one : {};
      const raw = cardOne.next_prediction || {};
      const componentMeta = raw._component_metadata || (player && player.meta && player.meta.components && player.meta.components.next_prediction_snapshot) || {};
      const release = (player && player.active_release) || {};
      const scope = (player && player.production_scope) || {};
      const gitCommit = raw.git_commit_hash || release.git_commit_hash || "";
      const rawCandidates = raw.candidates || raw.main_numbers || raw.recommend_numbers || [];
      const rawHighProbability = raw.high_probability_numbers || [];

      return {
        prediction_issue: raw.prediction_issue || raw.target_issue,
        based_on_issue: raw.based_on_issue || raw.source_issue,

        confidence: raw.confidence,
        confidence_available: Number.isFinite(Number(rawConfidence)),
        confidence_percent: confidencePercentValue(rawConfidence),
        raw_candidates: rawCandidates,

        raw_high_probability_numbers: rawHighProbability,
        high_probability_numbers: normalizeNumbers(rawHighProbability),
        size_prediction: raw.size_prediction || {},
        odd_even_prediction: raw.odd_even_prediction || {},
        phase: raw.phase || release.phase || "28",
        release_version: raw.release_version || release.release_version,
        git_commit_hash: gitCommit,
        git_commit_short: raw.git_commit_short || release.git_commit_short || (gitCommit ? String(gitCommit).slice(0, 7) : ""),
        production_generation: raw.production_generation || scope.production_generation || release.production_generation,
        production_start_issue: raw.production_start_issue || scope.production_start_issue || release.production_start_issue,
        production_start_at: raw.production_start_at || scope.production_start_at || release.production_start_at,
        model_version: raw.model_version || release.model_version,
        feature_version: raw.feature_version || release.feature_version,
        production_valid: raw.production_valid !== false,
        component_metadata: componentMeta,
        reasons: raw.reasons || [],
        rule_library: raw.rule_library || cardOne.rule_library || {}
      };
    }

    function normalizeOfficialDraw(data) {
      const player = data.playerSummary && data.playerSummary.status === "ok" ? data.playerSummary : null;
      const cardOne = player && player.card_one ? player.card_one : {};
      const raw = cardOne.latest_official_draw || cardOne.current_draw || {};
      const verificationStatus = normalizeOfficialStatus(raw.verification_status || raw.status);
      const rawNumbers = raw.numbers || [];
      return {
        issue: raw.issue,
        draw_time: raw.draw_time || raw.collected_at,
        raw_numbers: rawNumbers,
        numbers: normalizeNumbers(rawNumbers),
        super_number: raw.super_number,
        verification_status: verificationStatus,
        source_scope: raw.source_scope || "unknown"
      };
    }

    function render(data, errors) {
      const player = data.playerSummary && data.playerSummary.status === "ok" ? data.playerSummary : null;
      const next = normalizeNext(data);
      const officialDraw = normalizeOfficialDraw(data);
      const cardTwo = normalizeCardTwo(data);
      const cardThree = normalizeCardThree(data);

      const errorBox = document.getElementById("errorBox");
      errorBox.style.display = errors.length ? "block" : "none";
      errorBox.textContent = errors.length ? "Dashboard 資料暫時無法取得。" : "";

      try { renderNext(next, officialDraw); } catch (error) { console.warn("[dashboard] card one render failed", error); }
      renderCardTwo(cardTwo);
      renderCardThree(cardThree);
    }

    function toggleSection(id, button) {
      const element = document.getElementById(id);
      if (!element) return;
      const expanded = button.getAttribute("aria-expanded") === "true";
      button.setAttribute("aria-expanded", String(!expanded));
      element.hidden = expanded;
      const label = button.querySelector("span:last-child");
      if (label) label.textContent = expanded ? "展開查看" : "收合";
    }

    function renderNext(next, officialDraw) {
      const numbers = normalizeNumbers(next.candidates);
      const officialNumbers = normalizeNumbers((officialDraw || {}).numbers);
      const officialSuper = normalizeNumbers([(officialDraw || {}).super_number]).filter((number) => officialNumbers.includes(number));
      const ruleLibrary = next.rule_library || {};
      const stateNotice = componentStateNotice(next.component_metadata);
      const officialStatus = (officialDraw || {}).verification_status;
      const hasOfficialNumbers = hasValidNumberSet((officialDraw || {}).raw_numbers, 20);
      const hasPredictionNumbers = hasValidNumberSet((next || {}).raw_candidates, 20);
      const officialNumbersHtml = hasOfficialNumbers
        ? numberGrid(officialNumbers, "", officialSuper, "super")
        : `<div class="empty">等待官方驗證</div>`;
      const predictionNumbersHtml = hasPredictionNumbers
        ? numberGrid(numbers)
        : `<div class="empty">等待 AI 推薦</div>`;
      const card = document.getElementById("cardNext");
      const cardHtml = `
        <div class="card1-title">
          <h2>🎯 最新開獎與 AI 推薦</h2>
        </div>
        ${stateNotice}

        <div class="card1-section">
          <div class="card1-section-title">
            <h3>最新一期</h3>
          </div>
          <div class="card1-info-line">
            <span>第 ${safe((officialDraw || {}).issue)} 期</span>
            <span class="status-pill ${statusClass(officialStatus)}">${officialStatusText(officialStatus)}</span>
          </div>
          <div class="summary-line">開獎時間：${formatTimeOnly((officialDraw || {}).draw_time)}</div>
        </div>

        <div class="card1-section">
          <div class="card1-section-title">
            <h3>官方20個號碼</h3>
          </div>
          ${officialNumbersHtml}
        </div>

        <div class="card1-section">
          <div class="card1-section-title">
            <h3>下一期 AI 推薦</h3>
          </div>
          <div class="card1-fixed-row">
            <span>預測期號</span>
            <strong>第 ${safe(next.prediction_issue)} 期</strong>
          </div>
          <div>
            ${predictionNumbersHtml}
          </div>
        </div>

        <div class="card1-section">
          ${renderCompactHighProbability(next, numbers)}
        </div>

        <div class="card1-section">
          ${renderCardOneSignals(next)}
        </div>

        <div class="card1-section">
          <button class="collapse-button" type="button" aria-expanded="false" aria-controls="card1RuleSnapshotBody" onclick="toggleSection('card1RuleSnapshotBody', this)">
            <span>AI 推薦依據</span><span>展開查看</span>
          </button>
          <div id="card1RuleSnapshotBody" hidden>
            <div class="section">
              <p class="mini-title">AI 推薦依據</p>
              ${renderRuleSnapshotPreview(ruleLibrary)}
            </div>
          </div>
        </div>
      `;
      const cardOneComplete = isCompleteOfficialDraw(officialDraw)
        && isCompletePrediction(next)
        && isCardOneIssueAligned(officialDraw, next);
      if (!cardOneComplete && cardOneCommittedHtml) {
        // Card One is atomic: keep the last complete official + prediction
        // snapshot until the next complete aligned snapshot is ready.
        card.innerHTML = cardOneCommittedHtml;
        return;
      }
      if (cardOneComplete) {
        cardOneCommittedHtml = cardHtml;
      }
      card.innerHTML = cardHtml;
    }

    function renderCardTwo(cardTwo) {
      const payload = cardTwo || {};
      const title = cardTwoText(payload.title || "📖 AI 驗證與分析報告");
      const numbers = normalizeNumbers(payload.prediction_numbers);
      const matched = normalizeNumbers(payload.matched_numbers);
      const official = normalizeNumbers(payload.official_numbers);
      const officialSuper = normalizeNumbers([payload.super_number])[0];
      const rules = asList(payload.rules);
      const stateNotice = componentStateNotice(payload.component_metadata);
      if (payload.available !== true) {
        const waitingIssue = payload.issue || payload.requested_issue;
        document.getElementById("cardTwo").innerHTML = `
          <div class="card-two-shell">
            <div class="card-two-title">
              <h2>${title}</h2>
              ${waitingIssue ? `<div class="card-two-meta"><span class="card-two-pill">上一期期號：${cardTwoText(waitingIssue)}</span></div>` : ""}
            </div>
            ${stateNotice}
            <div class="empty">
              <strong>${cardTwoText(payload.status_text, "尚無已完成的最終分析報告")}</strong>
              <div class="summary-line">${cardTwoText(payload.fallback_text, "AI 正在等待足夠的正式開獎與驗證資料。")}</div>
            </div>
          </div>
        `;
        return;
      }
      const superText = payload.super_number_hit === true
        ? "是"
        : (payload.super_number_hit === false ? "否" : cardTwoText(payload.super_number_status_text, "資料不足"));
      const updateHint = payload.update_hint ? `<div class="notice warn">${cardTwoText(payload.update_hint)}</div>` : "";
      const rulesHtml = rules.length
        ? `<div class="analysis-report-list">${rules.map(renderCardTwoRule).join("")}</div>`
        : `<div class="empty">詳細規則分析整理中</div>`;
      document.getElementById("cardTwo").innerHTML = `
        <div class="card-two-shell">
          <div class="card-two-title">
            <h2>${title}</h2>
            <div class="card-two-meta">
              <span class="card-two-pill">上一期期號：${cardTwoText(payload.issue)}</span>
              <span class="card-two-pill card-two-pill-finalized">🟢 ${cardTwoText(payload.status_text, "最終分析")}</span>
            </div>
          </div>
          ${updateHint}
          ${stateNotice}
          <div class="card-two-summary">
            <div class="grid">
              ${metric("實際命中", `${fmtNumber(payload.hit_count)} / ${fmtNumber(payload.prediction_count || numbers.length)}`, "status-ok")}
              ${metric("超級獎命中", superText, payload.super_number_hit ? "status-ok" : "")}
              ${metric("大小", renderCardTwoDistributionResult(payload.size_result), cardTwoDistributionClass(payload.size_result))}
              ${metric("單雙", renderCardTwoDistributionResult(payload.odd_even_result), cardTwoDistributionClass(payload.odd_even_result))}
            </div>
            <div>
              <p class="mini-title">推薦 20 碼</p>
              ${cardTwoNumbers(numbers, matched, officialSuper)}
            </div>
          </div>
          <button class="card-two-toggle" type="button" aria-expanded="false" aria-controls="cardTwoReportBody" onclick="toggleCardTwoReport(this)">
            <span>查看詳細分析</span><span>▼</span>
          </button>
          <div id="cardTwoReportBody" hidden>
            <div class="section">
              <p class="mini-title">實際開獎 20 碼</p>
              ${official.length ? balls(official, "", matched) : `<div class="empty">尚無資料</div>`}
              <p class="mini-title">三星至六星連號</p>
              ${renderCardTwoConsecutiveGroups(payload.actual_consecutive_groups)}
              <p class="mini-title">詳細規則分析</p>
              ${rulesHtml}
            </div>
          </div>
        </div>
      `;
    }

    function toggleCardTwoReport(button) {
      const element = document.getElementById("cardTwoReportBody");
      if (!element) return;
      const expanded = button.getAttribute("aria-expanded") === "true";
      button.setAttribute("aria-expanded", String(!expanded));
      element.hidden = expanded;
      const spans = button.querySelectorAll("span");
      if (spans[0]) spans[0].textContent = expanded ? "查看詳細分析" : "收合詳細分析";
      if (spans[1]) spans[1].textContent = expanded ? "▼" : "▲";
    }

    function renderCardTwoRule(rule) {
      const title = rule.rule_name_zh || rule.title || rule.label || rule.rule_name;
      const candidates = normalizeNumbers(rule.candidates || rule.predicted_numbers || rule.prediction_numbers);
      const actual = normalizeNumbers(rule.actual_numbers || rule.official_numbers || rule.winning_numbers);
      const matched = normalizeNumbers(rule.matched_numbers);
      const summary = rule.summary || rule.detail || rule.description;
      const scoreText = rule.score_text || rule.score || rule.confidence_text;
      return `
        <div class="analysis-report-rule">
          <div class="analysis-report-rule-head">
            <span>${cardTwoText(title)}</span>
            <span class="${rule.status_text === "成功" || rule.status_text === "部分命中" ? "status-ok" : "status-unknown"}">${cardTwoText(rule.status_text)}</span>
          </div>
          <div class="analysis-report-field">
            <span class="analysis-report-label">預測號碼：</span>
            <div class="analysis-report-text">${candidates.length ? candidates.map(numberLabel).join("、") : "資料不足"}</div>
          </div>
          <div class="analysis-report-field">
            <span class="analysis-report-label">實際開出：</span>
            <div class="analysis-report-text">${actual.length ? actual.map(numberLabel).join("、") : "資料不足"}</div>
          </div>
          <div class="analysis-report-field">
            <span class="analysis-report-label">命中：</span>
            <div class="analysis-report-text">${matched.length ? matched.map(numberLabel).join("、") : "未命中"}</div>
          </div>
          <div class="analysis-report-field">
            <span class="analysis-report-label">規則結果：</span>
            <div class="analysis-report-text">${cardTwoText(rule.status_text, "資料不足")}</div>
          </div>
          <div class="analysis-report-field">
            <span class="analysis-report-label">分析摘要：</span>
            <div class="analysis-report-text">${cardTwoText(summary, "已完成正式評估。")}</div>
          </div>
          <div class="analysis-report-field">
            <span class="analysis-report-label">得分：</span>
            <div class="analysis-report-text">${cardTwoText(scoreText, "已完成評估")}</div>
          </div>
        </div>
      `;
    }

    function renderCardTwoDistributionResult(result) {
      const payload = result || {};
      if (!payload.status_text || payload.hit === null || payload.hit === undefined) return "資料不足";
      return `${cardTwoText(payload.status_text)}（預測 ${labelZh(payload.predicted)} / 實際 ${labelZh(payload.actual)}）`;
    }

    function cardTwoDistributionClass(result) {
      const payload = result || {};
      if (payload.hit === true) return "status-ok";
      if (payload.hit === false) return "status-warning";
      return "status-unknown";
    }

    function renderCardTwoConsecutiveGroups(groups) {
      const source = groups || {};
      const rows = [
        ["三星", source.three_star],
        ["四星", source.four_star],
        ["五星", source.five_star],
        ["六星", source.six_star]
      ];
      const html = rows.map(([label, values]) => {
        const combos = asList(values)
          .map((combo) => normalizeNumbers(combo))
          .filter((combo) => combo.length);
        const body = combos.length
          ? combos.map((combo) => combo.map(numberLabel).join("、")).join("　")
          : "無";
        return `<div class="analysis-report-field"><span class="analysis-report-label">${label}：</span><div class="analysis-report-text">${body}</div></div>`;
      }).join("");
      return `<div class="analysis-report-rule">${html}</div>`;
    }

    function renderCardThree(cardThree) {
      const payload = cardThree || {};
      const system = payload.system || {};
      const sections = payload.sections || {};
      const latestProcessing = sections.latest_processing || {};
      const aiFlow = sections.ai_flow || {};
      const systemHealth = sections.system_health || {};
      const learningStatus = sections.learning_status || {};
      const versionInfo = sections.version_info || {};
      const warnings = asList(system.warnings).filter(Boolean);
      const status = payload.status === "partial" || warnings.length ? "warning" : "ok";
      const syncOk = systemHealth.is_synced === true || Number(systemHealth.lag_count || 0) === 0;
      document.getElementById("cardReasons").innerHTML = `
        <h2>🤖 AI 運作中心</h2>
        <h3>最新處理資訊</h3>
        <div class="grid">
          ${metric("目前期號", safe(latestProcessing.current_issue || "尚無資料"))}
          ${metric("最後成功同步", formatDateTime(latestProcessing.last_successful_collection))}
        </div>
        <h3>AI 流程</h3>
        <div class="grid">
          ${metric("推薦狀態", statusText(aiFlow.next_prediction_status || "unknown"), statusClass(aiFlow.next_prediction_status || "unknown"))}
        </div>
        <h3>系統健康</h3>
        <div class="grid">
          ${metric("健康狀態", statusText(systemHealth.status || status), statusClass(systemHealth.status || status))}
          ${metric("同步狀態", syncOk ? "已同步" : `落後 ${fmtNumber(systemHealth.lag_count)} 期`, syncOk ? "status-ok" : "status-warning")}
        </div>
        ${warnings.length ? `<div class="notice warn">資料更新中：${warnings.map((item) => safe(item)).join("、")}</div>` : ""}
        <h3>AI 學習狀態</h3>
        <div class="grid">
          ${metric("學習狀態", statusText(learningStatus.status || "unknown"), statusClass(learningStatus.status || "unknown"))}
          ${metric("統計樣本", `${fmtNumber(learningStatus.sample_size)} 期`)}
          ${metric("平均命中", `${fmtNumber(learningStatus.average_hits)} / 20`)}
          ${metric("等待學習", fmtNumber(learningStatus.pending_learning))}
        </div>
        <h3>版本資訊</h3>
        <div class="grid">
          ${metric("版本", safe(versionInfo.release_version || "尚無資料"))}
        </div>

      `;
    }

    document.getElementById("refreshButton").addEventListener("click", () => {
      if (document.visibilityState !== "visible" || !ensurePollingLeader()) return;
      loadApiGroup(["playerSummary"]);
    });
    if (document.visibilityState === "visible") {
      startVisiblePolling();
    } else {
      startHiddenPolling();
    }
  </script>
</body>
</html>
