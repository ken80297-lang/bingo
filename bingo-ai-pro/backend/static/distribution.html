<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=0.25,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
<title>Bingo AI Pro｜每日球號分布</title>
<style>
*{box-sizing:border-box}html,body{width:100%;min-height:100%;overflow:auto}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#f5f8fc;color:#14243b}
header{height:64px;background:linear-gradient(110deg,#06294c,#06477b);color:#fff;display:flex;align-items:center;padding:0 18px;gap:18px;position:relative;z-index:20;box-shadow:0 2px 10px #001b3b33}
.brand{font-size:22px;font-weight:800;white-space:nowrap}.brand b{color:#ffd447}.title{font-size:18px;font-weight:700;border-left:1px solid #ffffff66;padding-left:18px}
main{padding:12px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;padding:10px;border:1px solid #d9e2ef;border-radius:10px;margin-bottom:10px}
input,button{height:38px;border:1px solid #cbd7e6;border-radius:7px;background:#fff;padding:0 12px;font-size:14px}button{cursor:pointer;font-weight:700}button.primary{background:#0878e8;color:#fff;border-color:#0878e8}
.info{margin-left:auto;font-size:13px;color:#51657e}.legend{display:flex;gap:12px;align-items:center;font-size:13px}.sw{width:22px;height:18px;border-radius:4px;display:inline-block;vertical-align:middle;margin-right:4px}.hit{background:#dcfcd7;color:#326c2c}.super{background:#66658f!important;color:#fff}.latest-label{color:#098c2e;font-weight:800}
.table-wrap{background:#fff;border:1px solid #d9e2ef;border-radius:8px;overflow:visible;box-shadow:none;position:relative}
/* Opt-in iPad horizontal-scroll experiment. Default presentation is unchanged. */
html.native-horizontal .table-wrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x pan-y pinch-zoom}#grid{position:relative}
html.canvas-mode #grid{display:none}html.canvas-mode #distributionCanvas{display:block}#distributionCanvas{display:none;width:2108px;max-width:none;background:#fff}table{border-collapse:separate;border-spacing:0;width:2108px;min-width:2108px;font-size:11px;table-layout:fixed}th,td{border-right:1px solid #000;border-bottom:1px solid #000;text-align:center;height:24px;min-width:23px;padding:0;white-space:nowrap}
thead th{background:#eaf1f9;font-size:11px;height:30px}.issue,.time,.odd-even{background:#fff}.issue{left:0;width:92px;min-width:92px;font-weight:650}.time{left:92px;width:54px;min-width:54px}.odd-even{left:146px;width:42px;min-width:42px;font-weight:800}.issue.size-big{background:#1647d8;color:#fff!important}.issue.size-small{background:#e33131;color:#fff!important}
tr.latest .issue,tr.latest .time{color:#078529;font-weight:800}
/* Keep table cells in normal painting flow: avoid WebKit pinch zoom cell misplacement. */
td.ball.hit{font-weight:650;font-size:10px}td.ball:not(.hit){background:#fff}td.ball.super{font-weight:800}.empty{color:#9aa9b9}.status{display:flex;gap:22px;align-items:center;padding:11px 4px;font-size:14px;flex-wrap:wrap}.status strong{color:#0878e8}.error{color:#c5222f;font-weight:700}
@media(max-width:700px){header{height:54px;padding:0 10px}.brand{font-size:18px}.title{font-size:15px;padding-left:10px}main{padding:7px}.info{width:100%;margin-left:0}.table-wrap{overflow:visible}table{font-size:10px}/* Preserve the same column widths at every viewport size. */}
.annotation-controls{display:flex;gap:5px;align-items:center}.dynamic-island .annotation-btn{height:30px;padding:0 9px;border-radius:999px;border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;font-size:12px}.dynamic-island .annotation-btn.active{background:#0878e8;border-color:#4aa5ff}.dynamic-island .annotation-btn:disabled{opacity:.4}.annotation-btn.active{background:#0878e8;color:#fff;border-color:#0878e8}.annotation-btn:disabled{opacity:.45;cursor:default}.annotation-layer{position:absolute;left:0;top:0;z-index:12;pointer-events:none;touch-action:auto}.annotation-layer.drawing{pointer-events:auto;touch-action:none!important;-webkit-user-select:none;user-select:none;overscroll-behavior:contain;cursor:crosshair} .dynamic-island{position:fixed;top:max(8px,env(safe-area-inset-top));right:8px;z-index:9999;display:flex;align-items:center;gap:7px;padding:6px 8px 6px 10px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(5,35,64,.94);color:#fff;box-shadow:none;white-space:nowrap;transform-origin:top right}.live-clock{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.7px}@media(max-width:700px){.dynamic-island{padding:5px 9px}.live-clock{font-size:13px}header{visibility:hidden;height:48px}}
</style></head>
<body><div class="dynamic-island" id="dynamicIsland"><span id="liveClock" class="live-clock">--:--:--</span><div class="annotation-controls"><button id="mark" class="annotation-btn" type="button" aria-pressed="false">✏️ 標記</button><button id="undo" class="annotation-btn" type="button" disabled>↶ 復原</button></div></div><header><div class="brand"><b>♛</b> Bingo AI Pro</div><div class="title">每日球號分布表</div></header>
<main><div class="toolbar">
<input id="date" type="date"><button id="today" class="primary">回到今天</button><button id="reload">重新整理</button>
<div class="legend"><span><i class="sw hit"></i>開出號碼</span><span><i class="sw super"></i>超級獎號</span></div>
</div>
<div class="table-wrap" id="annotationHost"><canvas id="annotationLayer" class="annotation-layer" aria-label="個人標記畫板"></canvas><canvas id="distributionCanvas" aria-label="每日球號分布表 Canvas 測試"></canvas><table id="grid"><colgroup><col style="width:92px"><col style="width:54px"><col style="width:42px"><col span="80" style="width:24px"></colgroup><thead><tr id="head"><th class="issue head-issue">期號</th><th class="time head-time">時間</th><th class="odd-even head-odd-even">單雙</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="status"><span id="day"></span><span>已開期數：<strong id="count">—</strong> / 203</span><span>最新：<strong id="latest">—</strong></span><span id="next"></span><span id="msg"></span></div>
</main>
<script>
// Compare native horizontal scrolling without changing the production default.
if(new URLSearchParams(location.search).get('horizontal')==='native')document.documentElement.classList.add('native-horizontal');
const canvasMode=new URLSearchParams(location.search).get('render')==='canvas';
if(canvasMode)document.documentElement.classList.add('canvas-mode');
const distributionCanvas=document.getElementById('distributionCanvas');
function renderCanvas(rows){
 const c=distributionCanvas,ctx=c.getContext('2d',{alpha:false});
 const width=2108,headerHeight=30,rowHeight=24,height=headerHeight+rows.length*rowHeight;
 if(c.width!==width)c.width=width;if(c.height!==height)c.height=height;c.style.height=height+'px';
 ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);
 const edges=[0,92,146,188];for(let i=1;i<=80;i++)edges.push(188+i*24);
 ctx.fillStyle='#eaf1f9';ctx.fillRect(0,0,width,headerHeight);
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='11px -apple-system, sans-serif';ctx.fillStyle='#14243b';
 const titles=['期號','時間','單雙'];for(let i=0;i<3;i++)ctx.fillText(titles[i],(edges[i]+edges[i+1])/2,15);
 for(let n=1;n<=80;n++)ctx.fillText(pad(n),188+(n-.5)*24,15);
 rows.forEach((d,i)=>{
  const y=headerHeight+i*rowHeight,nums=new Set((d.numbers||[]).map(Number)),sup=Number(d.super_number);
  const vals=[...nums],big=vals.filter(n=>n>=41).length,small=vals.filter(n=>n<=40).length,odd=vals.filter(n=>n%2).length;
  if(big>=13||small>=13){ctx.fillStyle=big>=13?'#1647d8':'#e33131';ctx.fillRect(0,y,92,rowHeight)}
  ctx.font='600 11px -apple-system, sans-serif';ctx.fillStyle=big>=13||small>=13?'#fff':i===0?'#078529':'#14243b';
  ctx.fillText(String(d.issue),46,y+12);
  ctx.fillStyle=i===0?'#078529':'#14243b';ctx.fillText(cleanTime(d.draw_time),119,y+12);
  ctx.fillStyle='#14243b';ctx.fillText(odd>=13?'單':vals.length-odd>=13?'雙':'－',167,y+12);
  for(const n of nums){if(n<1||n>80)continue;const x=188+(n-1)*24;
   ctx.fillStyle=n===sup?'#66658f':'#dcfcd7';ctx.fillRect(x,y,24,rowHeight);
   ctx.fillStyle=n===sup?'#fff':'#326c2c';ctx.font='600 10px -apple-system, sans-serif';ctx.fillText(pad(n),x+12,y+12);
  }
 });
 ctx.beginPath();ctx.strokeStyle='#000';ctx.lineWidth=1;
 for(const x of edges.slice(1)){const p=x-.5;ctx.moveTo(p,0);ctx.lineTo(p,height)}
 for(let y=headerHeight;y<=height;y+=rowHeight){const p=y-.5;ctx.moveTo(0,p);ctx.lineTo(width,p)}
 ctx.stroke();
}
const pad=n=>String(n).padStart(2,'0'); const localDate=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dateEl=document.getElementById('date'),body=document.getElementById('body'),head=document.getElementById('head');
for(let n=1;n<=80;n++){const th=document.createElement('th');th.textContent=pad(n);head.appendChild(th)}
dateEl.value=localDate();
function nextTime(t){if(!t)return '';const m=t.match(/(\d{1,2}):(\d{2})/);if(!m)return '';let x=+m[1]*60 + +m[2]+5;return pad(Math.floor(x/60)%24)+':'+pad(x%60)}
function cleanTime(v){
 const s=String(v||'');
 const iso=s.match(/T(\d{2}):(\d{2})/);
 if(iso){const mins=(+iso[1]*60 + +iso[2] + 480)%(24*60);return pad(Math.floor(mins/60))+':'+pad(mins%60)}
 const m=s.match(/(\d{1,2}):(\d{2})/);return m?pad(+m[1])+':'+m[2]:'—'
}
async function load(){
 if(load.inFlight)return;
 load.inFlight=true;
 if(!body.children.length)document.getElementById('msg').textContent='載入中…';
 try{
  const r=await fetch('/api/distribution?date='+encodeURIComponent(dateEl.value),{cache:'no-store'}); if(!r.ok)throw new Error('HTTP '+r.status);
  const p=await r.json(),rows=p.draws||[];
  const signature=JSON.stringify(rows.map(d=>[d.issue,d.numbers,d.super_number,d.draw_time]));
  if(load.lastSignature===signature && load.lastDate===dateEl.value)return;
  load.lastSignature=signature;load.lastDate=dateEl.value;
  if(canvasMode)renderCanvas(rows);
  const existing=canvasMode?new Map():new Map(Array.from(body.children,tr=>[tr.dataset.issue,tr]));
  const desired=[];
  if(!canvasMode)rows.forEach((d,i)=>{
   const key=String(d.issue), rowSignature=JSON.stringify([d.issue,d.numbers,d.super_number,d.draw_time]);
   let tr=existing.get(key);
   if(tr&&tr.dataset.signature===rowSignature){tr.classList.toggle('latest',i===0);desired.push(tr);return}
   tr=document.createElement('tr');tr.dataset.issue=key;tr.dataset.signature=rowSignature;
   if(i===0)tr.className='latest';
   const nums=new Set((d.numbers||[]).map(Number)),sup=Number(d.super_number);
   const values=[...nums],bigCount=values.filter(n=>n>=41).length,smallCount=values.filter(n=>n<=40).length,oddCount=values.filter(n=>n%2===1).length,evenCount=values.length-oddCount;
   const sizeClass=bigCount>=13?' size-big':smallCount>=13?' size-small':'';
   const oddEven=oddCount>=13?'單':evenCount>=13?'雙':'－';
   tr.innerHTML='<td class="issue'+sizeClass+'">'+d.issue+'</td><td class="time">'+cleanTime(d.draw_time)+'</td><td class="odd-even">'+oddEven+'</td>';
   for(let n=1;n<=80;n++){const td=document.createElement('td');td.className='ball';if(nums.has(n)){td.classList.add('hit');td.textContent=pad(n);if(n===sup)td.classList.add('super')}tr.appendChild(td)}
   desired.push(tr)
  });
  // Move only rows whose positions changed. Keep the other ~200 rows attached
  // so Safari does not lay out and repaint the entire table every five minutes.
  if(!canvasMode)desired.forEach((tr,i)=>{if(body.children[i]!==tr)body.insertBefore(tr,body.children[i]||null)});
  const wanted=new Set(desired);
  if(!canvasMode)Array.from(body.children).forEach(tr=>{if(!wanted.has(tr))tr.remove()});
  document.getElementById('day').textContent=dateEl.value+(dateEl.value===localDate()?'（今天）':'');
  document.getElementById('count').textContent=rows.length;
  document.getElementById('latest').textContent=rows[0]?(rows[0].issue+'（'+cleanTime(rows[0].draw_time)+'）'):'—';
  const nt=rows[0]?nextTime(cleanTime(rows[0].draw_time)):'';document.getElementById('next').textContent=(dateEl.value===localDate()&&nt)?'下一期：'+nt:'';
  document.getElementById('msg').textContent=rows.length?'':'當日尚無資料';
 }catch(e){document.getElementById('msg').innerHTML='<span class="error">載入失敗：'+e.message+'</span>'}
 finally{load.inFlight=false}
}
dateEl.addEventListener('change',load);document.getElementById('reload').onclick=load;document.getElementById('today').onclick=()=>{dateEl.value=localDate();load()};load();setInterval(()=>{if(dateEl.value===localDate())load()},5000);
function tickClock(){document.getElementById('liveClock').textContent=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(new Date())}tickClock();setInterval(tickClock,1000);
// Diagnostic mode: keep the island visible but stop repositioning it on every
// visualViewport scroll event. This isolates Safari's scroll-linked style updates.
const islandStaticTest=new URLSearchParams(location.search).get('island')==='static';
const island=document.getElementById('dynamicIsland');
// A fixed element is positioned in the layout viewport on iPad Safari.
// Translate to the visual viewport so it remains visible while pinch-zoomed.
let islandFrame=0;
function positionIsland(){
 islandFrame=0;
 const v=window.visualViewport;
 const top=v?Math.max(8,v.offsetTop+8):8;
 const right=v?Math.max(8,window.innerWidth-v.offsetLeft-v.width+8):8;
 if(island.style.top!==top+'px')island.style.top=top+'px';
 if(island.style.right!==right+'px')island.style.right=right+'px';
}
function scheduleIsland(){if(!islandFrame)islandFrame=requestAnimationFrame(positionIsland)}
if(!islandStaticTest)scheduleIsland();
if(window.visualViewport&&!islandStaticTest){
 visualViewport.addEventListener('scroll',scheduleIsland,{passive:true});
 visualViewport.addEventListener('resize',scheduleIsland,{passive:true});
}
if(!islandStaticTest)window.addEventListener('orientationchange',scheduleIsland,{passive:true});

/* Local-only annotation overlay: never touches draw data, API, DB, or AI lifecycle. */
const annotationHost=document.getElementById('annotationHost');
const annotationLayer=document.getElementById('annotationLayer');
const markBtn=document.getElementById('mark');
const undoBtn=document.getElementById('undo');
const annotationCtx=annotationLayer.getContext('2d');
let annotationEnabled=false,annotationDrawing=false,annotationCurrent=null,annotationStrokes=[];

function annotationPoint(e){
 const r=annotationLayer.getBoundingClientRect();
 return {x:(e.clientX-r.left)*(annotationLayer.width/r.width),y:(e.clientY-r.top)*(annotationLayer.height/r.height)};
}
function resizeAnnotation(){
 if(!annotationEnabled&&!annotationStrokes.length)return;
 const grid=canvasMode?distributionCanvas:document.getElementById('grid');
 const w=Math.max(1,grid.scrollWidth,grid.offsetWidth,annotationHost.scrollWidth);
 const h=Math.max(1,grid.scrollHeight,grid.offsetHeight,annotationHost.scrollHeight);
 if(annotationLayer.width===w&&annotationLayer.height===h&&annotationLayer.style.width===w+'px'&&annotationLayer.style.height===h+'px')return;
 annotationLayer.width=w;annotationLayer.height=h;
 annotationLayer.style.width=w+'px';annotationLayer.style.height=h+'px';
 redrawAnnotation();
}
function redrawAnnotation(){
 annotationCtx.clearRect(0,0,annotationLayer.width,annotationLayer.height);
 annotationCtx.lineCap='round';annotationCtx.lineJoin='round';annotationCtx.strokeStyle='#e32636';annotationCtx.lineWidth=4;
 annotationStrokes.forEach(points=>{
  if(!points.length)return;
  annotationCtx.beginPath();annotationCtx.moveTo(points[0].x,points[0].y);
  points.slice(1).forEach(p=>annotationCtx.lineTo(p.x,p.y));annotationCtx.stroke();
 });
 undoBtn.disabled=annotationStrokes.length===0;
}
function setAnnotationEnabled(on){
 annotationEnabled=on;
 if(on)resizeAnnotation();annotationLayer.classList.toggle('drawing',on);annotationHost.classList.toggle('annotation-active',on);markBtn.classList.toggle('active',on);
 markBtn.setAttribute('aria-pressed',String(on));markBtn.textContent=on?'✓ 標記中':'✏️ 標記';
}
markBtn.addEventListener('click',()=>setAnnotationEnabled(!annotationEnabled));
undoBtn.addEventListener('click',()=>{if(annotationStrokes.length){annotationStrokes.pop();redrawAnnotation();if(!annotationStrokes.length&&!annotationEnabled){annotationLayer.width=1;annotationLayer.height=1;annotationLayer.style.width='1px';annotationLayer.style.height='1px'}}});
annotationLayer.addEventListener('pointerdown',e=>{
 if(!annotationEnabled)return;e.preventDefault();e.stopPropagation();annotationDrawing=true;annotationCurrent=[annotationPoint(e)];
 annotationStrokes.push(annotationCurrent);annotationLayer.setPointerCapture(e.pointerId);redrawAnnotation();
});
annotationLayer.addEventListener('pointermove',e=>{
 if(!annotationDrawing||!annotationCurrent)return;e.preventDefault();e.stopPropagation();annotationCurrent.push(annotationPoint(e));redrawAnnotation();
});
function finishAnnotation(e){if(!annotationDrawing)return;annotationDrawing=false;annotationCurrent=null;try{annotationLayer.releasePointerCapture(e.pointerId)}catch(_){}}
annotationLayer.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();finishAnnotation(e)});
annotationLayer.addEventListener('pointercancel',finishAnnotation);
/* iOS Safari fallback: prevent page pan while annotation mode owns the touch. */
['touchstart','touchmove','touchend'].forEach(type=>annotationLayer.addEventListener(type,e=>{
 if(annotationEnabled){e.preventDefault();e.stopPropagation()}
},{passive:false}));
new ResizeObserver(resizeAnnotation).observe(annotationHost);annotationLayer.width=1;annotationLayer.height=1;annotationLayer.style.width='1px';annotationLayer.style.height='1px';
</script></body></html>
